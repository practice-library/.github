- name: Fetch @@toolname@@ @@tool.version@@, pinned by sha256
  shell: bash
  env:
    TOOL_URL: @@tool.url@@
    TOOL_SHA256: @@tool.sha256@@
    TOOL_ARCHIVE: @@tool.archive@@
  run: |
    set -euo pipefail
    dir="$RUNNER_TEMP/tools/@@toolname@@"
    mkdir -p "$dir"
    curl -fsSL --retry @@fetch.retries@@ "$TOOL_URL" -o "$dir/archive"
    echo "$TOOL_SHA256  $dir/archive" | sha256sum -c -
    case "$TOOL_ARCHIVE" in
      tar.gz) tar -xzf "$dir/archive" -C "$dir" ;;
      zip) unzip -q "$dir/archive" -d "$dir" ;;
      *) echo "::error::unknown archive type $TOOL_ARCHIVE"; exit 1 ;;
    esac
