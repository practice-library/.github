- name: Compare the result with the expectation
  shell: bash
  env:
    EXPECT: ${{ inputs.@@tool.expectInput@@ }}
    RC: ${{ steps.run.outputs.rc }}
    FINDING_RC: @@tool.findingExitCode@@
  run: |
    set -euo pipefail
    case "${EXPECT:-pass}" in
      pass) [ "$RC" = 0 ] || { echo "::error::@@toolname@@ reported findings (exit $RC)"; exit 1; } ;;
      fail) [ "$RC" = "$FINDING_RC" ] || { echo "::error::expected @@toolname@@ to report a finding (exit $FINDING_RC), got exit $RC"; exit 1; } ;;
      error) [ "$RC" != 0 ] && [ "$RC" != "$FINDING_RC" ] || { echo "::error::expected @@toolname@@ to stop on a setup error, got exit $RC"; exit 1; } ;;
      *) echo "::error::expect must be pass, fail or (in a self-test fixture) error, got $EXPECT"; exit 1 ;;
    esac
