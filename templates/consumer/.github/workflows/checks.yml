name: checks
# Calls @@org.name@@/@@org.repo@@'s reusable workflows at one pinned commit. The gate's needs must
# equal the jobs in @@gate.requiredChecksFile@@.
on:
  pull_request:
    branches: [@@org.defaultBranch@@]
    # labeled and unlabeled re-run schema-loosening when a maintainer adds or removes its label.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [@@org.defaultBranch@@]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  discover:
    uses: @@org.name@@/@@org.repo@@/.github/workflows/discover.yml@__PIN__ # __REF__
    with:
      check: schema-check
  schema-check:
    needs: [discover]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.targets) }}
    uses: @@org.name@@/@@org.repo@@/.github/workflows/schema-check.yml@__PIN__ # __REF__
    with:
      schema: ${{ matrix.schema }}
      instances: ${{ matrix.instances }}
      expect: ${{ matrix.expect }}
      each: ${{ matrix.each }}
  leak-scan:
    uses: @@org.name@@/@@org.repo@@/.github/workflows/leak-scan.yml@__PIN__ # __REF__
  denylist:
    permissions:
      contents: read
      pull-requests: read
    uses: @@org.name@@/@@org.repo@@/.github/workflows/@@guards.workflow@@@__PIN__ # __REF__
    with:
      guard: denylist
  removed-paths:
    permissions:
      contents: read
      pull-requests: read
    uses: @@org.name@@/@@org.repo@@/.github/workflows/@@guards.workflow@@@__PIN__ # __REF__
    with:
      guard: removed-paths
  release-note:
    permissions:
      contents: read
      pull-requests: read
    uses: @@org.name@@/@@org.repo@@/.github/workflows/@@guards.workflow@@@__PIN__ # __REF__
    with:
      guard: release-note
  schema-loosening:
    permissions:
      contents: read
      pull-requests: read
    uses: @@org.name@@/@@org.repo@@/.github/workflows/@@guards.workflow@@@__PIN__ # __REF__
    with:
      guard: schema-loosening
  @@gate.callerJob@@:
    if: always()
    needs: [discover, schema-check, leak-scan, denylist, removed-paths, release-note, schema-loosening]
    uses: @@org.name@@/@@org.repo@@/.github/workflows/gate.yml@__PIN__ # __REF__
    with:
      needs: ${{ toJSON(needs) }}
