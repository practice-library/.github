name: self
# This repository's own checks. Every row of `checks` in policy/constants.json becomes two jobs:
# the check on its discovered targets, and the check on its self-test fixtures. The gate needs all.
on:
  pull_request:
    branches: [@@org.defaultBranch@@]
    # labeled and unlabeled re-run schema-loosening when a maintainer adds or removes its label.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [@@org.defaultBranch@@]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: self-${{ github.ref }}
  cancel-in-progress: true
jobs:
  render:
    name: render
    runs-on: @@runner.image@@
    timeout-minutes: @@runner.timeoutMinutes@@
    steps:
      - uses: @@actions.checkout.repo@@@@@actions.checkout.sha@@ # @@actions.checkout.version@@
        with:
          persist-credentials: false
      - name: Generated files match policy/constants.json
        run: bash @@render.script@@ --check

  unit:
    name: unit
    runs-on: @@runner.image@@
    timeout-minutes: @@runner.timeoutMinutes@@
    steps:
      - uses: @@actions.checkout.repo@@@@@actions.checkout.sha@@ # @@actions.checkout.version@@
        with:
          # The denylist canary reads the author of a past merge commit from history.
          fetch-depth: 0
          persist-credentials: false
      - name: Every script is executable in a fresh clone
        run: |
          set -euo pipefail
          bad="$(git ls-files -s -- ':(glob)scripts/*.sh' ':(glob)selftest/*.sh' | awk '$1 != "100755" { print $4 }')"
          [ -z "$bad" ] || { echo "::error::not executable (chmod +x, then git add): $bad"; exit 1; }
      - name: Unit cases for the logic the workflows embed
        run: bash @@self.unitScript@@
      - name: Every guard in those libraries has a mutant that turns a case red
        run: bash @@self.mutantsScript@@
      - name: The denylist step on a simulated maintainer merge
        run: bash @@self.denylistCanary@@

  denylist:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/@@guards.workflow@@
    with:
      guard: denylist

  removed-paths:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/@@guards.workflow@@
    with:
      guard: removed-paths
      history: '@@json:self.historyFiles@@'

  release-note:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/@@guards.workflow@@
    with:
      guard: release-note
      watch: '@@json:self.releaseWatch@@'

  schema-loosening:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/@@guards.workflow@@
    with:
      guard: schema-loosening

  size:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/@@guards.workflow@@
    with:
      guard: size
      size-fixtures: '@@json:self.sizeFixtures@@'

  @@self.discoverJob@@:
    name: @@self.discoverJob@@
    runs-on: @@runner.image@@
    timeout-minutes: @@runner.timeoutMinutes@@
    outputs:
      @@gen:outputs@@
    steps:
      - uses: @@actions.checkout.repo@@@@@actions.checkout.sha@@ # @@actions.checkout.version@@
        with:
          persist-credentials: false
      - name: Each check's targets and self-test fixtures
        id: list
        run: bash @@self.discoverScript@@ >> "$GITHUB_OUTPUT"

  #@gen jobs

  @@gate.callerJob@@:
    if: always()
    needs: @@gen:needs@@
    uses: ./.github/workflows/gate.yml
    with:
      needs: ${{ toJSON(needs) }}
