name: self-message
# Judges protocol v0 messages opened in this repository (docs/protocol.md).
on:
  issues:
    types: [opened, edited, labeled]
permissions:
  contents: read
jobs:
  message:
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/message-check.yml
    with:
      app-login: @@org.appLogin@@
