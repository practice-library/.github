name: gate
on:
  workflow_call:
    inputs:
      needs:
        description: The caller's toJSON(needs). The gate passes only when every one of those jobs succeeded and they are exactly the jobs listed in @@gate.requiredChecksFile@@.
        type: string
        required: true
permissions:
  contents: read
jobs:
  @@gate.innerJob@@:
    name: @@gate.innerJob@@
    runs-on: @@runner.image@@
    timeout-minutes: @@runner.timeoutMinutes@@
    steps:
      - uses: @@actions.checkout.repo@@@@@actions.checkout.sha@@ # @@actions.checkout.version@@
        with:
          persist-credentials: false
          sparse-checkout: .github
      - name: The needs are exactly the jobs in @@gate.requiredChecksFile@@
        shell: bash
        env:
          NEEDS: ${{ inputs.needs }}
          FILE: @@gate.requiredChecksFile@@
          MANDATORY: '@@json:gate.mandatoryJobs@@'
        run: |
          set -euo pipefail
          #@include gate-required.sh
          [ -f "$FILE" ] || { echo "::error::$FILE is missing"; exit 1; }
          REQUIRED="$(jq -c '.jobs' "$FILE")"
          export REQUIRED
          result="$(main)"
          echo "$result"
          [ "${result%% *}" = ok ]
      - uses: @@actions.allsGreen.repo@@@@@actions.allsGreen.sha@@ # @@actions.allsGreen.version@@
        with:
          jobs: ${{ inputs.needs }}
