name: gate
on:
  workflow_call:
    inputs:
      needs:
        description: The caller's toJSON(needs). The gate passes only when every one of those jobs succeeded and they are exactly the jobs listed in @@gate.requiredChecksFile@@.
        type: string
        required: true
permissions:
  contents: read
jobs:
  @@gate.innerJob@@:
    name: @@gate.innerJob@@
    runs-on: @@runner.image@@
    timeout-minutes: @@runner.timeoutMinutes@@
    steps:
      - uses: @@actions.checkout.repo@@@@@actions.checkout.sha@@ # @@actions.checkout.version@@
        with:
          persist-credentials: false
          sparse-checkout: |
            .github
            docs
      - name: The needs are exactly the jobs in @@gate.requiredChecksFile@@
        shell: bash
        env:
          NEEDS: ${{ inputs.needs }}
          FILE: @@gate.requiredChecksFile@@
          MANDATORY: '@@json:gate.mandatoryJobs@@'
        run: |
          set -euo pipefail
          #@include gate-required.sh
          [ -f "$FILE" ] || { echo "::error::$FILE is missing"; exit 1; }
          REQUIRED="$(jq -c '.jobs' "$FILE")"
          export REQUIRED
          result="$(main)"
          echo "$result"
          [ "${result%% *}" = ok ]
      - name: CODEOWNERS owns no path in @@automerge.pathsFile@@
        shell: bash
        env:
          PATHS_FILE: @@automerge.pathsFile@@
        run: |
          set -euo pipefail
          #@include codeowners-allow.sh
          ALLOW='[]'
          if [ -f "$PATHS_FILE" ]; then ALLOW="$(jq -c '.paths' "$PATHS_FILE")"; fi
          CODEOWNERS=""
          for f in .github/CODEOWNERS CODEOWNERS docs/CODEOWNERS; do
            if [ -f "$f" ]; then CODEOWNERS="$(cat "$f")"; break; fi
          done
          export ALLOW CODEOWNERS
          result="$(main)"
          echo "$result"
          [ "${result%% *}" = ok ]
      #@fetch yq
      - name: Every @@org.name@@ workflow or action is pinned to a commit, not a branch
        shell: bash
        env:
          ROOT: .
          ORG: @@org.name@@
          YQ: ${{ runner.temp }}/tools/yq/@@tools.yq.bin@@
        run: |
          set -euo pipefail
          #@include pin-check.sh
          export ROOT ORG
          result="$(main)"
          echo "$result"
          [ "${result%% *}" = ok ] || { echo "::error::$result: pin the full commit SHA of a release, with the tag as a comment (ADOPTING.md)"; exit 1; }
      - uses: @@actions.allsGreen.repo@@@@@actions.allsGreen.sha@@ # @@actions.allsGreen.version@@
        with:
          jobs: ${{ inputs.needs }}
