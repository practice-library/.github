name: discover
# What a check runs on in the calling repository, as a matrix: every <dir>/<targetFile> for a check
# with a targetFile, else one repository-wide entry. The checks and their files come from the
# checks registry of @@org.name@@/@@org.repo@@, so a repository keeps no list of its own.
on:
  workflow_call:
    inputs:
      check:
        description: 'The check to discover targets for: one of @@gen:checkids@@.'
        type: string
        required: true
    outputs:
      targets:
        description: JSON array for strategy.matrix.include.
        value: ${{ jobs.list.outputs.targets }}
permissions:
  contents: read
jobs:
  list:
    name: discover
    runs-on: @@runner.image@@
    timeout-minutes: @@runner.timeoutMinutes@@
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    steps:
      #@include self-checkout.yml
      - uses: @@actions.checkout.repo@@@@@actions.checkout.sha@@ # @@actions.checkout.version@@
        with:
          path: @@tooling.callerPath@@
          persist-credentials: false
      - name: Targets
        id: list
        shell: bash
        working-directory: @@tooling.callerPath@@
        env:
          CHECK: ${{ inputs.check }}
          CHECKS: '@@json:checks@@'
        run: |
          set -euo pipefail
          ROW="$(jq -c --arg id "$CHECK" '.[] | select(.id == $id)' <<<"$CHECKS")"
          [ -n "$ROW" ] || { echo "::error::unknown check $CHECK; known: $(jq -c '[.[].id]' <<<"$CHECKS")"; exit 1; }
          export ROW
          found="$RUNNER_TEMP/targets.json"
          "$PRACTICE_CI" fragment discover-targets --root "$CALLER_ROOT" --result "$found"
          echo "targets=$(jq -r '.detail' "$found")" >> "$GITHUB_OUTPUT"
