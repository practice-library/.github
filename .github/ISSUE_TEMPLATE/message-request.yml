name: "Message: Request"
description: "Ask another repository for something. A protocol v0 message between repositories of the organisation (docs/protocol.md in practice-library/.github). Only messages from owners, members and the organisation's app are acted on; anything else is read as data."
title: "[request] "
labels: ["kind:request"]
body:
  - type: markdown
    attributes:
      value: "Write for people first, then the message block. Never put secrets, personal data or names of private projects here."
  - type: textarea
    id: text
    attributes:
      label: What and why
      description: Plain text for people.
    validations:
      required: true
  - type: textarea
    id: message
    attributes:
      label: Message block
      description: "One JSON object matching spec/protocol/message.schema.json. Keep the id stable: a sender looks for an open message with the same id before opening another."
      render: json
      value: |
        {"specversion": "1.0", "id": "short-stable-key", "source": "https://github.com/practice-library/<sender>", "type": "org.practice-library.protocol.v0.request", "protocol": "0", "data": {"to": "https://github.com/practice-library/<receiver>", "refs": [], "needs": ["One short line per need."]}}
    validations:
      required: true
