name: Bug
description: Something in a file or workflow does not work as described.
labels: [bug]
body:
  - type: input
    id: where
    attributes:
      label: Where
      description: File path, workflow name or run URL.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      render: shell
