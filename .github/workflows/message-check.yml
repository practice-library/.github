# Generated from templates/.github/workflows/message-check.yml and policy/constants.json by scripts/render.sh. Do not edit.
name: message-check
# Protocol v0 (docs/protocol.md): judges an issue that is a message. Call it on issues events (opened,
# edited, labeled) with issues: write. An issue is a message when it carries a kind:* label and its
# author is an owner or member of the organisation, or the app-login identity; anything else is an
# external signal and is left alone. A message must hold exactly one ```json block that matches
# spec/protocol/message.schema.json, whose type agrees with the kind:* label, and the body must hold no
# denied term. An invalid message gets the label state:invalid and one comment saying why; the author's
# text is never edited, and no part of it is repeated in the comment.
# Trust comes from the current GitHub body edit's editor and immutable edit ID. Foreign revisions
# remain invalid even if their workflow runs are skipped or reordered and the original bytes return.
# Before the run acts, it reads the edit identity again and stops if that revision has changed.
# The rules live in tooling/practice_ci/protocol.py, read from a checkout of this repository at its release tag.
on:
  workflow_call:
    inputs:
      app-login:
        description: The login of the organisation's app, whose issues are messages too, for example name[bot]. Empty means none.
        type: string
        default: ''
      denylist:
        description: The denylist file on the default branch.
        type: string
        default: .github/denylist.json
permissions:
  contents: read
jobs:
  message:
    name: message-check
    # Serialize writers. Trust comes from GitHub edit history, not delivery of pending runs.
    concurrency:
      group: message-check-${{ github.repository }}-${{ github.event.issue.number }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    env:
      PRACTICE_CI_TOOLING: ${{ github.workspace }}/.practice-ci/tooling
    steps:
      - name: Is this issue from a trusted author?
        id: who
        shell: bash
        env:
          ASSOCIATION: ${{ github.event.issue.author_association }}
          LOGIN: ${{ github.event.issue.user.login }}
          APP: ${{ inputs.app-login }}
          LABELS: ${{ toJSON(github.event.issue.labels.*.name) }}
        run: |
          set -euo pipefail
          kind="$(jq -r '[.[] | select(startswith("kind:")) | ltrimstr("kind:")] | if length == 1 then .[0] elif length == 0 then "" else "many" end' <<<"$LABELS")"
          trusted=false
          case "$ASSOCIATION" in OWNER|MEMBER) trusted=true ;; esac
          if [ -n "$APP" ] && [ "$LOGIN" = "$APP" ]; then trusted=true; fi
          if [ "$trusted" != true ]; then echo "external signal: read as data, not judged as a message"; echo "trusted=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          { echo "trusted=true"; echo "kind=$kind"; } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.who.outputs.trusted == 'true'
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.who.outputs.trusted == 'true'
        with:
          repository: practice-library/.github
          ref: v3.0.0
          path: .practice-ci
          persist-credentials: false
      - name: Whose revision is this body?
        if: steps.who.outputs.trusted == 'true'
        id: trust
        shell: bash
        env:
          ISSUE_NODE: ${{ github.event.issue.node_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # protocol: runs tooling/practice_ci/protocol.py (docs/protocol.md), which holds every rule about a message
          # body and about whom a message trusts. PRACTICE_CI_TOOLING is the directory holding practice_ci; unset, it is
          # the tooling directory of the working directory. The body is untrusted text, read only as data.
          protocol() {
            python3 -I -c 'import sys; sys.path.insert(0, sys.argv[1]); from practice_ci import protocol; sys.exit(protocol.main(sys.argv[2:]))' \
              "${PRACTICE_CI_TOOLING:-tooling}" "$@"
          }

          # main: finds the message block in an issue body. BODY_FILE is a file holding the body. Prints one line:
          #   ok <compact JSON>   one message block, decoded once without a key given twice
          #   none ...            no message block: the issue is not a message
          #   invalid <why>       anything else (docs/protocol.md, "A message")
          main() {
            protocol extract "${BODY_FILE:-}"
          }
          read_revision() {
            gh api graphql -f query='query($id:ID!){node(id:$id){... on Issue{body createdAt lastEditedAt author{login} userContentEdits(last:1){nodes{id editor{login}}}}}}' -f "id=$ISSUE_NODE" | jq -e '.data.node' > "$1"
          }
          read_revision "$RUNNER_TEMP/revision.json"
          jq -j '.body' "$RUNNER_TEMP/revision.json" > "$RUNNER_TEMP/body.md"
          got="$(protocol snapshot "$RUNNER_TEMP/revision.json")"
          digest="$(jq -r '.digest' <<<"$got")"
          echo "$got"
          {
            echo "digest=$digest"
            echo "what=$(jq -r '.what' <<<"$got")"
            echo "status=$(jq -r '.status // ""' <<<"$got")"
            echo "reason=$(jq -r '.reason // ""' <<<"$got")"
          } >> "$GITHUB_OUTPUT"
      - name: Fetch jsonschema 17.2.1, pinned by sha256
        shell: bash
        env:
          TOOL_URL: https://github.com/sourcemeta/jsonschema/releases/download/v17.2.1/jsonschema-17.2.1-linux-x86_64.zip
          TOOL_SHA256: 9ffee3cfbe0fe1343d9d36bcce9e6036ec4d73e4b29f656c039fca6118da2f35
          TOOL_ARCHIVE: zip
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/tools/jsonschema"
          mkdir -p "$dir"
          curl -fsSL --retry 3 "$TOOL_URL" -o "$dir/archive"
          echo "$TOOL_SHA256  $dir/archive" | sha256sum -c -
          case "$TOOL_ARCHIVE" in
            tar.gz) tar -xzf "$dir/archive" -C "$dir" ;;
            zip) unzip -q "$dir/archive" -d "$dir" ;;
            *) echo "::error::unknown archive type $TOOL_ARCHIVE"; exit 1 ;;
          esac
      - name: Judge the message
        if: steps.trust.outputs.what == 'judge' && steps.who.outputs.kind != ''
        id: judge
        shell: bash
        env:
          KIND: ${{ steps.who.outputs.kind }}
          LIST: ${{ inputs.denylist }}
          JSONSCHEMA: ${{ runner.temp }}/tools/jsonschema/jsonschema-17.2.1-linux-x86_64/bin/jsonschema
          MESSAGE_SPEC: '{"$schema":"https://json-schema.org/draft/2020-12/schema","$id":"https://github.com/practice-library/.github/spec/protocol/message.schema.json","title":"Protocol v0 message","description":"The one fenced json block of an issue that is a message between two repositories of the organisation. Top-level names follow CloudEvents 1.0 (specversion, id, source, type, time, datacontenttype, data); protocol is an extension attribute. See docs/protocol.md.","type":"object","required":["specversion","id","source","type","protocol","data"],"additionalProperties":false,"properties":{"specversion":{"const":"1.0","description":"The CloudEvents version the field names follow."},"id":{"type":"string","pattern":"^[a-z0-9][a-z0-9._:-]{2,127}$","description":"The stable idempotency key: the sender looks for an open message with this id before creating one."},"source":{"type":"string","pattern":"^https://github\\.com/practice-library/[A-Za-z0-9._-]+$","description":"The sending repository."},"type":{"enum":["org.practice-library.protocol.v0.request","org.practice-library.protocol.v0.answer","org.practice-library.protocol.v0.status","org.practice-library.protocol.v0.blocked","org.practice-library.protocol.v0.decision","org.practice-library.protocol.v0.proposal"],"description":"The kind of message."},"protocol":{"const":"0","description":"The protocol version; a reader ignores a message of a version it does not know, with a warning."},"time":{"type":"string","pattern":"^(?:[0-9]{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12][0-9]|3[01])|(?:0[469]|11)-(?:0[1-9]|[12][0-9]|30)|02-(?:0[1-9]|1[0-9]|2[0-8]))|(?:[0-9]{2}(?:0[48]|[2468][048]|[13579][26])|(?:[02468][048]|[13579][26])00)-02-29)T(?:[01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]Z$","description":"When the message was written, UTC."},"datacontenttype":{"const":"application/json"},"data":{"type":"object","required":["to"],"additionalProperties":false,"properties":{"to":{"type":"string","pattern":"^https://github\\.com/practice-library/[A-Za-z0-9._-]+$","description":"The receiving repository."},"refs":{"type":"array","maxItems":20,"uniqueItems":true,"items":{"type":"string","pattern":"^[A-Za-z0-9-]+/[A-Za-z0-9._-]+#[1-9][0-9]{0,6}$"},"description":"Related issues and pull requests, as owner/repo#n."},"needs":{"type":"array","maxItems":10,"items":{"type":"string","minLength":1,"maxLength":200},"description":"What the sender needs, one short line each."},"expires":{"type":"string","pattern":"^(?:[0-9]{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12][0-9]|3[01])|(?:0[469]|11)-(?:0[1-9]|[12][0-9]|30)|02-(?:0[1-9]|1[0-9]|2[0-8]))|(?:[0-9]{2}(?:0[48]|[2468][048]|[13579][26])|(?:[02468][048]|[13579][26])00)-02-29)T(?:[01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]Z$"}}}},"allOf":[{"if":{"properties":{"type":{"const":"org.practice-library.protocol.v0.blocked"}},"required":["type"]},"then":{"properties":{"data":{"required":["needs"],"properties":{"needs":{"minItems":1}}}}}},{"if":{"properties":{"type":{"const":"org.practice-library.protocol.v0.decision"}},"required":["type"]},"then":{"properties":{"data":{"required":["refs"],"properties":{"refs":{"minItems":1}}}}}}]}'
        run: |
          set -uo pipefail
          verdict() { echo "$1"; printf 'reason=%s\n' "$2" >> "$GITHUB_OUTPUT"; exit 0; }
          # protocol: runs tooling/practice_ci/protocol.py (docs/protocol.md), which holds every rule about a message
          # body and about whom a message trusts. PRACTICE_CI_TOOLING is the directory holding practice_ci; unset, it is
          # the tooling directory of the working directory. The body is untrusted text, read only as data.
          protocol() {
            python3 -I -c 'import sys; sys.path.insert(0, sys.argv[1]); from practice_ci import protocol; sys.exit(protocol.main(sys.argv[2:]))' \
              "${PRACTICE_CI_TOOLING:-tooling}" "$@"
          }

          # main: finds the message block in an issue body. BODY_FILE is a file holding the body. Prints one line:
          #   ok <compact JSON>   one message block, decoded once without a key given twice
          #   none ...            no message block: the issue is not a message
          #   invalid <why>       anything else (docs/protocol.md, "A message")
          main() {
            protocol extract "${BODY_FILE:-}"
          }
          BODY_FILE="$RUNNER_TEMP/body.md"; export BODY_FILE
          got="$(main)"
          case "$got" in
            ok*) printf '%s\n' "${got#ok }" > "$RUNNER_TEMP/message.json" ;;
            none*) verdict "$got" "it has a kind:* label but no \`\`\`json message block" ;;
            *) verdict "$got" "its message block is not usable: ${got#invalid }" ;;
          esac
          [ "$KIND" != many ] || verdict "more than one kind:* label" "it carries more than one kind:* label"
          printf '%s' "$MESSAGE_SPEC" > "$RUNNER_TEMP/message.schema.json"
          rc=0; "$JSONSCHEMA" validate "$RUNNER_TEMP/message.schema.json" "$RUNNER_TEMP/message.json" || rc=$?
          [ "$rc" -eq 0 ] || verdict "schema exit $rc" "its message block does not match spec/protocol/message.schema.json (the run log says where)"
          type="$(jq -r '.type' "$RUNNER_TEMP/message.json")"
          [ "${type##*.}" = "$KIND" ] || verdict "type ${type##*.} against label kind:$KIND" "its type does not agree with its kind:* label"
          unset -f main
          # main: prints "ok ...", "found <n> <where>...", "unguarded ..." or "invalid ..."; the term itself is
          # never printed. The scan is tooling/practice_ci/guards/denylist.py, which reads git as bytes (names,
          # quoted paths and commit messages with a NUL are exact) and judges typed records.
          # Inputs: DENY (JSON, see the module), EVENT, TEXT_FILE (rows "<where><TAB><text>") or MB and HEAD.
          # TODO: call scripts/practice-ci denylist once the core track adds the launcher.
          main() {
            python3 -I "${PRACTICE_CI_RUNNER:-tooling/run_practice_ci.py}" denylist
          }
          DENY=""
          if [ -f "$LIST" ]; then DENY="$(cat "$LIST")"; fi
          awk '{ print "issue body:" NR "\t" $0 }' "$RUNNER_TEMP/body.md" > "$RUNNER_TEMP/text.tsv"
          TEXT_FILE="$RUNNER_TEMP/text.tsv"; export DENY TEXT_FILE
          scan="$(main)"
          echo "$scan"
          case "$scan" in
            ok*) ;;
            found*) verdict "$scan" "it holds a denied term (${scan#found })" ;;
            *) verdict "$scan" "the denylist could not judge it: ${scan%% *}" ;;
          esac
          echo "ok a valid protocol v0 message"
      - name: Record the verdict, label and comment
        if: steps.who.outputs.trusted == 'true'
        shell: bash
        env:
          ISSUE_NODE: ${{ github.event.issue.node_id }}
          RUN_ID: ${{ github.run_id }}
          WHAT: ${{ steps.trust.outputs.what }}
          TRUST_STATUS: ${{ steps.trust.outputs.status }}
          TRUST_REASON: ${{ steps.trust.outputs.reason }}
          DIGEST: ${{ steps.trust.outputs.digest }}
          KIND: ${{ steps.who.outputs.kind }}
          REASON: ${{ steps.judge.outputs.reason }}
          NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          HAS_INVALID: ${{ contains(github.event.issue.labels.*.name, 'state:invalid') }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # protocol: runs tooling/practice_ci/protocol.py (docs/protocol.md), which holds every rule about a message
          # body and about whom a message trusts. PRACTICE_CI_TOOLING is the directory holding practice_ci; unset, it is
          # the tooling directory of the working directory. The body is untrusted text, read only as data.
          protocol() {
            python3 -I -c 'import sys; sys.path.insert(0, sys.argv[1]); from practice_ci import protocol; sys.exit(protocol.main(sys.argv[2:]))' \
              "${PRACTICE_CI_TOOLING:-tooling}" "$@"
          }

          # main: finds the message block in an issue body. BODY_FILE is a file holding the body. Prints one line:
          #   ok <compact JSON>   one message block, decoded once without a key given twice
          #   none ...            no message block: the issue is not a message
          #   invalid <why>       anything else (docs/protocol.md, "A message")
          main() {
            protocol extract "${BODY_FILE:-}"
          }
          # Compare durable revision identities, not just body bytes (A -> B -> A).
          gh api graphql -f query='query($id:ID!){node(id:$id){... on Issue{body createdAt lastEditedAt author{login} userContentEdits(last:1){nodes{id editor{login}}}}}}' -f "id=$ISSUE_NODE" | jq -e '.data.node' > "$RUNNER_TEMP/revision-now.json"
          now="$(protocol snapshot "$RUNNER_TEMP/revision-now.json")"
          if [ "$(jq -r '.digest' <<<"$now")" != "$DIGEST" ]; then
            echo "the revision changed while it was judged"; exit 0
          fi
          if [ "$WHAT" != judge ]; then
            REASON="$TRUST_REASON"; status="$TRUST_STATUS"
          elif [ "$KIND" = "" ] || [ -z "$REASON" ]; then
            status=accepted
          else
            status=invalid
          fi
          gh api --paginate "repos/$REPO/issues/$NUMBER/comments" | jq -s 'add // []' > "$RUNNER_TEMP/comments.json"
          if [ "$(protocol can-record "$RUN_ID" "$RUNNER_TEMP/comments.json")" != true ]; then
            echo "a verdict from this or a newer run is already recorded"; exit 0
          fi
          existing="$(protocol verdict-id "$RUNNER_TEMP/comments.json")"
          # An issue that is not a message gets a verdict only to clear an earlier one: the author's edit resubmits it.
          if [ "$KIND" = "" ] && [ -z "$existing" ] && [ "$status" = accepted ]; then
            echo "not a message: no kind:* label"; exit 0
          fi
          line="$(protocol verdict "$status" "$DIGEST" "$RUN_ID")"
          text="$line"$'\n'"Protocol verdict ($status) for this revision of the message. It is bound to the body and its GitHub edit identity; a foreign revision is invalid until the author edits again."
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$existing" -f "body=$text" > /dev/null
          else
            gh api -X POST "repos/$REPO/issues/$NUMBER/comments" -f "body=$text" > /dev/null
          fi
          if [ "$KIND" = "" ]; then echo "not a message: no kind:* label"; exit 0; fi
          if [ -z "$REASON" ]; then
            if [ "$HAS_INVALID" = true ]; then gh api -X DELETE "repos/$REPO/issues/$NUMBER/labels/state:invalid" > /dev/null; fi
            echo "valid"; exit 0
          fi
          if [ "$HAS_INVALID" != true ]; then
            gh api -X POST "repos/$REPO/issues/$NUMBER/labels" -f "labels[]=state:invalid" > /dev/null
            gh api -X POST "repos/$REPO/issues/$NUMBER/comments" -f "body=This issue is not a valid protocol v0 message: $REASON. See docs/protocol.md in practice-library/.github." > /dev/null
          fi
          echo "::error::invalid message: $REASON"; exit 1
