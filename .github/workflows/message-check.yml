# Generated from templates/.github/workflows/message-check.yml and policy/constants.json by scripts/render.sh. Do not edit.
name: message-check
# Protocol v0 (docs/protocol.md): judges an issue that is a message. Call it on issues events (opened,
# edited, labeled) with issues: write. An issue is a message when it carries a kind:* label and its
# author is an owner or member of the organisation, or the app-login identity; anything else is an
# external signal and is left alone. A message must hold exactly one ```json block that matches
# spec/protocol/message.schema.json, whose type agrees with the kind:* label, and the body must hold no
# denied term. An invalid message gets the label state:invalid and one comment saying why; the author's
# text is never edited, and no part of it is repeated in the comment.
on:
  workflow_call:
    inputs:
      app-login:
        description: The login of the organisation's app, whose issues are messages too, for example name[bot]. Empty means none.
        type: string
        default: ''
      denylist:
        description: The denylist file on the default branch.
        type: string
        default: .github/denylist.json
permissions:
  contents: read
jobs:
  message:
    name: message-check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      # Checks out this repository's tooling at the commit that defines the running job, beside the caller's
      # checkout, and makes PRACTICE_CI (the launcher) and CALLER_ROOT available to the later steps.
      # job.workflow_repository and job.workflow_sha exist on GitHub.com only; both are judged before checkout,
      # since an empty repository or ref would make checkout pick the caller or its default branch.
      - name: The workflow's own repository and commit
        shell: bash
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          # main: judges the identity of the workflow that defines the running job, before anything is checked
          # out with it. Prints "ok <repository>@<sha>" when both are usable, otherwise "invalid <why>". Nothing
          # is defaulted: actions/checkout reads an empty repository as the caller and an empty ref as the default
          # branch, so an empty or malformed identity must stop the job here instead of selecting other code.
          #   WORKFLOW_REPOSITORY  job.workflow_repository: owner/name
          #   WORKFLOW_SHA         job.workflow_sha: the full commit, 40 lower-case hex characters
          main() {
            local repo="${WORKFLOW_REPOSITORY:-}" sha="${WORKFLOW_SHA:-}"
            if [ -z "$repo" ]; then echo "invalid job.workflow_repository is empty (this needs GitHub.com)"; return 0; fi
            if ! [[ "$repo" =~ ^[A-Za-z0-9-]+/[A-Za-z0-9._-]+$ ]] || [[ "$repo" == */. ]] || [[ "$repo" == */.. ]]; then
              echo "invalid job.workflow_repository is not owner/name"; return 0
            fi
            if [ -z "$sha" ]; then echo "invalid job.workflow_sha is empty (this needs GitHub.com)"; return 0; fi
            if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then echo "invalid job.workflow_sha is not 40 lower-case hex characters"; return 0; fi
            echo "ok $repo@$sha"
          }
          verdict="$(main)"
          echo "$verdict"
          [ "$verdict" = "ok $WORKFLOW_REPOSITORY@$WORKFLOW_SHA" ] || { echo "::error::${verdict#* }; nothing is checked out"; exit 1; }
      - name: Check out the tooling at the workflow's own commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: practice-ci
          persist-credentials: false
          submodules: false
          lfs: false
      - name: The tooling is exactly that commit
        shell: bash
        env:
          TOOLING: ${{ github.workspace }}/practice-ci
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          LAUNCHER: tooling/practice-ci
        run: |
          set -euo pipefail
          # main: judges the tooling checkout before anything in it runs. Prints "ok <sha>" when the repository in
          # TOOLING is at exactly WORKFLOW_SHA and holds the launcher; "mismatch ..." when HEAD is another commit;
          # "bootstrap ..." when that commit has no launcher (a commit from before the tooling existed: pin a
          # release that ships it, nothing is fetched from elsewhere); "invalid ..." when TOOLING is no repository.
          #   TOOLING       the directory the workflow's own commit was checked out into
          #   WORKFLOW_SHA  job.workflow_sha
          #   LAUNCHER      the launcher's path inside TOOLING
          main() {
            local head
            if ! head="$(git -C "${TOOLING:-}" rev-parse --verify --quiet HEAD^{commit} 2>/dev/null)"; then
              echo "invalid ${TOOLING:-(unset)} is not a checked-out repository"; return 0
            fi
            if [ "$head" != "${WORKFLOW_SHA:-}" ]; then
              echo "mismatch the tooling checkout is at $head, not job.workflow_sha ${WORKFLOW_SHA:-(unset)}"; return 0
            fi
            if [ -z "${LAUNCHER:-}" ] || [ ! -f "$TOOLING/$LAUNCHER" ]; then
              echo "bootstrap $head has no ${LAUNCHER:-launcher}: this commit predates the tooling, so pin a release that ships it"; return 0
            fi
            echo "ok $head"
          }
          verdict="$(main)"
          echo "$verdict"
          [ "$verdict" = "ok $WORKFLOW_SHA" ] || { echo "::error::${verdict#* }"; exit 1; }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.12.16
      - name: The tooling's interpreter
        shell: bash
        env:
          TOOLING: ${{ github.workspace }}/practice-ci
          CALLER: ${{ github.workspace }}/caller
          LAUNCHER: tooling/practice-ci
        run: |
          set -euo pipefail
          "$TOOLING/$LAUNCHER" version
          { echo "PRACTICE_CI=$TOOLING/$LAUNCHER"; echo "CALLER_ROOT=$CALLER"; } >> "$GITHUB_ENV"
      - name: Is this issue a message?
        id: who
        shell: bash
        env:
          ASSOCIATION: ${{ github.event.issue.author_association }}
          LOGIN: ${{ github.event.issue.user.login }}
          APP: ${{ inputs.app-login }}
          LABELS: ${{ toJSON(github.event.issue.labels.*.name) }}
          KIND_PREFIX: 'kind:'
        run: |
          set -euo pipefail
          kind="$(jq -r --arg p "$KIND_PREFIX" '[.[] | select(startswith($p)) | ltrimstr($p)] | if length == 1 then .[0] elif length == 0 then "" else "many" end' <<<"$LABELS")"
          trusted=false
          case "$ASSOCIATION" in OWNER|MEMBER) trusted=true ;; esac
          if [ -n "$APP" ] && [ "$LOGIN" = "$APP" ]; then trusted=true; fi
          if [ -z "$kind" ]; then echo "not a message: no ${KIND_PREFIX}* label"; echo "judge=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$trusted" != true ]; then echo "external signal: read as data, not judged as a message"; echo "judge=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          { echo "judge=true"; echo "kind=$kind"; } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.who.outputs.judge == 'true'
        with:
          path: caller
          persist-credentials: false
      - name: Fetch jsonschema 17.2.1, pinned by sha256
        shell: bash
        env:
          TOOL_URL: https://github.com/sourcemeta/jsonschema/releases/download/v17.2.1/jsonschema-17.2.1-linux-x86_64.zip
          TOOL_SHA256: 9ffee3cfbe0fe1343d9d36bcce9e6036ec4d73e4b29f656c039fca6118da2f35
          TOOL_ARCHIVE: zip
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/tools/jsonschema"
          mkdir -p "$dir"
          curl -fsSL --retry 3 "$TOOL_URL" -o "$dir/archive"
          echo "$TOOL_SHA256  $dir/archive" | sha256sum -c -
          case "$TOOL_ARCHIVE" in
            tar.gz) tar -xzf "$dir/archive" -C "$dir" ;;
            zip) unzip -q "$dir/archive" -d "$dir" ;;
            *) echo "::error::unknown archive type $TOOL_ARCHIVE"; exit 1 ;;
          esac
      - name: Judge the message
        if: steps.who.outputs.judge == 'true'
        id: judge
        shell: bash
        working-directory: caller
        env:
          BODY: ${{ github.event.issue.body }}
          KIND: ${{ steps.who.outputs.kind }}
          KIND_PREFIX: 'kind:'
          LIST: ${{ inputs.denylist }}
          JSONSCHEMA: ${{ runner.temp }}/tools/jsonschema/jsonschema-17.2.1-linux-x86_64/bin/jsonschema
          MESSAGE_SPEC: '{"$schema":"https://json-schema.org/draft/2020-12/schema","$id":"https://github.com/practice-library/.github/spec/protocol/message.schema.json","title":"Protocol v0 message","description":"The one fenced json block of an issue that is a message between two repositories of the organisation. Top-level names follow CloudEvents 1.0 (specversion, id, source, type, time, datacontenttype, data); protocol is an extension attribute. See docs/protocol.md.","type":"object","required":["specversion","id","source","type","protocol","data"],"additionalProperties":false,"properties":{"specversion":{"const":"1.0","description":"The CloudEvents version the field names follow."},"id":{"type":"string","pattern":"^[a-z0-9][a-z0-9._:-]{2,127}$","description":"The stable idempotency key: the sender looks for an open message with this id before creating one."},"source":{"type":"string","pattern":"^https://github\\.com/practice-library/[A-Za-z0-9._-]+$","description":"The sending repository."},"type":{"enum":["org.practice-library.protocol.v0.request","org.practice-library.protocol.v0.answer","org.practice-library.protocol.v0.status","org.practice-library.protocol.v0.blocked","org.practice-library.protocol.v0.decision","org.practice-library.protocol.v0.proposal"],"description":"The kind of message."},"protocol":{"const":"0","description":"The protocol version; a reader ignores a message of a version it does not know, with a warning."},"time":{"type":"string","pattern":"^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$","description":"When the message was written, UTC."},"datacontenttype":{"const":"application/json"},"data":{"type":"object","required":["to"],"additionalProperties":false,"properties":{"to":{"type":"string","pattern":"^https://github\\.com/practice-library/[A-Za-z0-9._-]+$","description":"The receiving repository."},"refs":{"type":"array","maxItems":20,"uniqueItems":true,"items":{"type":"string","pattern":"^[A-Za-z0-9-]+/[A-Za-z0-9._-]+#[1-9][0-9]{0,6}$"},"description":"Related issues and pull requests, as owner/repo#n."},"needs":{"type":"array","maxItems":10,"items":{"type":"string","minLength":1,"maxLength":200},"description":"What the sender needs, one short line each."},"expires":{"type":"string","pattern":"^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"}}}},"allOf":[{"if":{"properties":{"type":{"const":"org.practice-library.protocol.v0.blocked"}},"required":["type"]},"then":{"properties":{"data":{"required":["needs"],"properties":{"needs":{"minItems":1}}}}}},{"if":{"properties":{"type":{"const":"org.practice-library.protocol.v0.decision"}},"required":["type"]},"then":{"properties":{"data":{"required":["refs"],"properties":{"refs":{"minItems":1}}}}}}]}'
        run: |
          set -uo pipefail
          verdict() { echo "$1"; printf 'reason=%s\n' "$2" >> "$GITHUB_OUTPUT"; exit 0; }
          printf '%s' "$BODY" > "$RUNNER_TEMP/body.md"
          BODY_FILE="$RUNNER_TEMP/body.md"; export BODY_FILE
          got="$RUNNER_TEMP/extract.json"
          "$PRACTICE_CI" fragment message-extract --root "$CALLER_ROOT" --result "$got" --keep-going > /dev/null \
            || verdict "message-extract could not run" "its message block could not be read"
          case "$(jq -r '.reason' "$got")" in
            message-extract.ok) jq -r '.detail' "$got" > "$RUNNER_TEMP/message.json" ;;
            message-extract.none) verdict "$(jq -r '.message' "$got")" "it has a ${KIND_PREFIX}* label but no \`\`\`json message block" ;;
            *) verdict "$(jq -r '.message' "$got")" "its message block is not usable: $(jq -r '.detail' "$got")" ;;
          esac
          [ "$KIND" != many ] || verdict "more than one ${KIND_PREFIX}* label" "it carries more than one ${KIND_PREFIX}* label"
          printf '%s' "$MESSAGE_SPEC" > "$RUNNER_TEMP/message.schema.json"
          rc=0; "$JSONSCHEMA" validate "$RUNNER_TEMP/message.schema.json" "$RUNNER_TEMP/message.json" || rc=$?
          [ "$rc" -eq 0 ] || verdict "schema exit $rc" "its message block does not match spec/protocol/message.schema.json (the run log says where)"
          type="$(jq -r '.type' "$RUNNER_TEMP/message.json")"
          [ "${type##*.}" = "$KIND" ] || verdict "type ${type##*.} against label $KIND_PREFIX$KIND" "its type does not agree with its ${KIND_PREFIX}* label"
          DENY=""
          if [ -f "$LIST" ]; then DENY="$(cat "$LIST")"; fi
          awk '{ print "issue body:" NR "\t" $0 }' "$RUNNER_TEMP/body.md" > "$RUNNER_TEMP/text.tsv"
          TEXT_FILE="$RUNNER_TEMP/text.tsv"; export DENY TEXT_FILE
          scan="$RUNNER_TEMP/scan.json"
          "$PRACTICE_CI" fragment denylist-scan --root "$CALLER_ROOT" --result "$scan" --keep-going \
            || verdict "denylist-scan could not run" "the denylist could not judge it: error"
          case "$(jq -r '.reason' "$scan")" in
            denylist-scan.ok) ;;
            denylist-scan.found) verdict "$(jq -r '.message' "$scan")" "it holds a denied term ($(jq -r '.detail' "$scan"))" ;;
            *) verdict "$(jq -r '.message' "$scan")" "the denylist could not judge it: $(jq -r '.reason | ltrimstr("denylist-scan.")' "$scan")" ;;
          esac
          echo "ok a valid protocol v0 message"
      - name: Label and comment
        if: steps.who.outputs.judge == 'true'
        shell: bash
        env:
          REASON: ${{ steps.judge.outputs.reason }}
          NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          INVALID: 'state:invalid'
          HAS_INVALID: ${{ contains(github.event.issue.labels.*.name, 'state:invalid') }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "$REASON" ]; then
            if [ "$HAS_INVALID" = true ]; then gh api -X DELETE "repos/$REPO/issues/$NUMBER/labels/$INVALID" > /dev/null; fi
            echo "valid"; exit 0
          fi
          if [ "$HAS_INVALID" != true ]; then
            gh api -X POST "repos/$REPO/issues/$NUMBER/labels" -f "labels[]=$INVALID" > /dev/null
            gh api -X POST "repos/$REPO/issues/$NUMBER/comments" -f "body=This issue is not a valid protocol v0 message: $REASON. See docs/protocol.md in practice-library/.github." > /dev/null
          fi
          echo "::error::invalid message: $REASON"; exit 1
