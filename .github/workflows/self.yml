# Generated from templates/.github/workflows/self.yml and policy/constants.json by scripts/render.sh. Do not edit.
name: self
# This repository's own checks: it calls its reusable workflows exactly as any other repository
# would, runs every fixture under selftest/fixtures through them, and ends in the gate.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: self-${{ github.ref }}
  cancel-in-progress: true
jobs:
  leak-scan:
    uses: ./.github/workflows/leak-scan.yml

  schema:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON('[{"id":"constants","schema":"policy/constants.schema.json","instances":"policy/constants.json"}]') }}
    uses: ./.github/workflows/schema-check.yml
    with:
      schema: ${{ matrix.schema }}
      instances: ${{ matrix.instances }}

  render:
    name: render
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generated files match policy/constants.json
        run: bash scripts/render.sh --check

  fixtures:
    name: fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      leak-scan: ${{ steps.list.outputs.leak-scan }}
      schema-check: ${{ steps.list.outputs.schema-check }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: List the fixtures by the check they exercise
        id: list
        run: bash selftest/list.sh selftest/fixtures case.json >> "$GITHUB_OUTPUT"

  selftest-leak-scan:
    needs: fixtures
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.fixtures.outputs.leak-scan) }}
    uses: ./.github/workflows/leak-scan.yml
    with:
      fixture: ${{ matrix.fixture }}
      expect: ${{ matrix.expect }}

  selftest-schema-check:
    needs: fixtures
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.fixtures.outputs.schema-check) }}
    uses: ./.github/workflows/schema-check.yml
    with:
      fixture: ${{ matrix.fixture }}
      expect: ${{ matrix.expect }}
      schema: ${{ matrix.schema }}
      instances: ${{ matrix.instances }}

  gate:
    if: always()
    needs: [leak-scan, schema, render, fixtures, selftest-leak-scan, selftest-schema-check]
    uses: ./.github/workflows/gate.yml
    with:
      needs: ${{ toJSON(needs) }}
