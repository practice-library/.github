# Generated from templates/.github/workflows/self.yml and policy/constants.json by scripts/render.sh. Do not edit.
name: self
# This repository's own checks. Every row of `checks` in policy/constants.json becomes two jobs:
# the check on its discovered targets, and the check on its self-test fixtures. The gate needs all.
on:
  pull_request:
    branches: [main]
    # labeled and unlabeled re-run schema-loosening when a maintainer adds or removes its label.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: self-${{ github.ref }}
  cancel-in-progress: true
jobs:
  render:
    name: render
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generated files match policy/constants.json
        run: bash scripts/render.sh --check

  unit:
    name: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The denylist canary reads the author of a past merge commit from history.
          fetch-depth: 0
          persist-credentials: false
      - name: Every script is executable in a fresh clone
        run: |
          set -euo pipefail
          bad="$(git ls-files -s -- ':(glob)scripts/*.sh' ':(glob)selftest/*.sh' | awk '$1 != "100755" { print $4 }')"
          [ -z "$bad" ] || { echo "::error::not executable (chmod +x, then git add): $bad"; exit 1; }
      - name: Unit cases for the logic the workflows embed
        run: bash scripts/unit.sh
      - name: The shipped tightening list clears the v2.1.0 date patterns and nothing else
        env:
          TIGHTEN: '[{"sha256":"7663e1bec8c96806db4767e51a62f6277cb32c33f31ef220b58e1e38c368fc2e","why":"v2.1.0 node measuredAt: any YYYY-MM-DD becomes a real calendar date"},{"sha256":"b3f86a4733165b4c53c2522ac953dc11eddb93189459f76af87f876f23d52983","why":"v2.1.0 node attrs.fetched_at: any text ending in Z becomes a real UTC date-time ending in Z"},{"sha256":"ac72432b0442a01bda943d78218bfb26c30cbb525aa82869035e4d4fa0b9bf4d","why":"v2.1.0 refresh-report and sources $defs.time (moved from practice-library/graphs): the same time of day, on a real calendar date"}]'
        run: |
          set -euo pipefail
          source selftest/lib/schema-loosening.sh
          data=selftest/unit/schema-loosening/data
          got="$(OLD_FILE="$data/node-v2.0.0.json" NEW_FILE="$data/node-v2.1.0.json" main)"
          want='loose ["properties/attrs/properties/verdict/enum","properties/edges/items/properties/rel/enum"]'
          [ "$got" = "$want" ] || { echo "::error::v2.0.0 to v2.1.0 node schema: got $got"; exit 1; }
          echo "$got"
      - name: Every library has mutants, and each mutant turns a case red
        run: bash scripts/mutants.sh
      - name: The denylist step on a simulated maintainer merge
        run: bash scripts/denylist-canary.sh

  denylist:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/guard.yml
    with:
      guard: denylist

  removed-paths:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/guard.yml
    with:
      guard: removed-paths
      history: '["CHANGELOG.md","docs/live-proof.md"]'

  release-note:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/guard.yml
    with:
      guard: release-note
      watch: '["consumer/","spec/",".github/workflows/","rulesets/"]'

  schema-loosening:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/guard.yml
    with:
      guard: schema-loosening

  size:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/guard.yml
    with:
      guard: size
      size-fixtures: '["selftest/","examples/","counter-examples/","tests/fixtures/","/README.md","docs/new-repo-checklist.md","/.github/workflows/",".github/automerge-paths.json",".github/CODEOWNERS",".github/dependabot.yml",".github/required-checks.json",".gitleaks.toml","/consumer/","/rulesets/","spec/node/schema.json"]'

  discover:
    name: discover
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      targets-leak-scan: ${{ steps.list.outputs.targets-leak-scan }}
      fixtures-leak-scan: ${{ steps.list.outputs.fixtures-leak-scan }}
      targets-schema-check: ${{ steps.list.outputs.targets-schema-check }}
      fixtures-schema-check: ${{ steps.list.outputs.fixtures-schema-check }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Each check's targets and self-test fixtures
        id: list
        run: bash scripts/discover.sh >> "$GITHUB_OUTPUT"

  leak-scan:
    needs: [discover]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.targets-leak-scan) }}
    uses: ./.github/workflows/leak-scan.yml

  selftest-leak-scan:
    needs: [discover]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.fixtures-leak-scan) }}
    uses: ./.github/workflows/leak-scan.yml
    with:
      _selftest-fixture: ${{ matrix.fixture }}
      _selftest-expect: ${{ matrix.expect }}

  schema-check:
    needs: [discover]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.targets-schema-check) }}
    uses: ./.github/workflows/schema-check.yml
    with:
      schema: ${{ matrix.schema }}
      instances: ${{ matrix.instances }}
      resolve: ${{ matrix.resolve }}
      guards: ${{ matrix.guards }}
      expect: ${{ matrix.expect }}
      each: ${{ matrix.each }}
      mode: ${{ matrix.mode }}
      resolve-ids: ${{ matrix.resolve-ids }}

  selftest-schema-check:
    needs: [discover]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.fixtures-schema-check) }}
    uses: ./.github/workflows/schema-check.yml
    with:
      _selftest-fixture: ${{ matrix.fixture }}
      expect: ${{ matrix.expect }}
      schema: ${{ matrix.schema }}
      instances: ${{ matrix.instances }}
      resolve: ${{ matrix.resolve }}
      guards: ${{ matrix.guards }}
      each: ${{ matrix.each }}
      mode: ${{ matrix.mode }}
      resolve-ids: ${{ matrix.resolve-ids }}

  gate:
    if: always()
    needs: ["render","discover","unit","denylist","removed-paths","release-note","schema-loosening","size","leak-scan","selftest-leak-scan","schema-check","selftest-schema-check"]
    uses: ./.github/workflows/gate.yml
    with:
      needs: ${{ toJSON(needs) }}
