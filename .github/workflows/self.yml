# Generated from templates/.github/workflows/self.yml and policy/constants.json by scripts/render.sh. Do not edit.
name: self
# This repository's own checks. Every row of `checks` in policy/constants.json becomes two jobs:
# the check on its discovered targets, and the check on its self-test fixtures. The gate needs all.
on:
  pull_request:
    branches: [main]
    # labeled and unlabeled re-run schema-loosening when a maintainer adds or removes its label.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: self-${{ github.ref }}
  cancel-in-progress: true
jobs:
  render:
    name: render
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generated files match policy/constants.json
        run: bash scripts/render.sh --check

  unit:
    name: unit
    runs-on: ubuntu-24.04
    # Every unit case and every mutant of every library: longer than the other jobs.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The denylist canary reads the author of a past merge commit from history.
          fetch-depth: 0
          persist-credentials: false
      - name: Every script is executable in a fresh clone
        run: |
          set -euo pipefail
          bad="$(git ls-files -s -- ':(glob)scripts/*.sh' ':(glob)selftest/*.sh' | awk '$1 != "100755" { print $4 }')"
          [ -z "$bad" ] || { echo "::error::not executable (chmod +x, then git add): $bad"; exit 1; }
      - name: Fetch yq 4.44.3, pinned by sha256
        shell: bash
        env:
          TOOL_URL: https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64.tar.gz
          TOOL_SHA256: a347ccde5e32c607670e15526e295c58a555a68cbb36d15cf18d24fd7af0e2fd
          TOOL_ARCHIVE: tar.gz
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/tools/yq"
          mkdir -p "$dir"
          curl -fsSL --retry 3 "$TOOL_URL" -o "$dir/archive"
          echo "$TOOL_SHA256  $dir/archive" | sha256sum -c -
          case "$TOOL_ARCHIVE" in
            tar.gz) tar -xzf "$dir/archive" -C "$dir" ;;
            zip) unzip -q "$dir/archive" -d "$dir" ;;
            *) echo "::error::unknown archive type $TOOL_ARCHIVE"; exit 1 ;;
          esac
      - name: Unit cases for the logic the workflows embed
        env:
          YQ: ${{ runner.temp }}/tools/yq/yq_linux_amd64
        run: bash scripts/unit.sh
      - name: reconcile.sh refuses a baseline for another check, and --check without a name
        run: |
          set -euo pipefail
          r=spec/ratchet/reconcile.sh; b=selftest/unit/ratchet/data/empty-list.json
          bash "$r" --check example-check "$b" < /dev/null
          if bash "$r" --check other-check "$b" < /dev/null; then echo "::error::--check other-check passed"; exit 1; fi
          rc=0; bash "$r" --check "" "$b" < /dev/null || rc=$?
          [ "$rc" = 2 ] || { echo "::error::--check with an empty name gave exit $rc, not the usage exit 2"; exit 1; }
      - name: The shipped tightening list is exactly the reviewed fixture pairs and clears nothing else
        env:
          TIGHTEN: '[{"sha256":"7663e1bec8c96806db4767e51a62f6277cb32c33f31ef220b58e1e38c368fc2e","why":"v2.1.0 node measuredAt: any YYYY-MM-DD becomes a real calendar date"},{"sha256":"b3f86a4733165b4c53c2522ac953dc11eddb93189459f76af87f876f23d52983","why":"v2.1.0 node attrs.fetched_at: any text ending in Z becomes a real UTC date-time ending in Z"},{"sha256":"ac72432b0442a01bda943d78218bfb26c30cbb525aa82869035e4d4fa0b9bf4d","why":"v2.1.0 refresh-report and sources defs.time (moved from practice-library/graphs): the same time of day, on a real calendar date"}]'
        run: |
          set -euo pipefail
          source templates/fragments/schema-loosening.sh
          data=selftest/unit/schema-loosening/data
          got="$(OLD_FILE="$data/node-v2.0.0.json" NEW_FILE="$data/node-v2.1.0.json" main)"
          want='loose ["properties/attrs/properties/verdict/enum","properties/edges/items/properties/rel/enum","properties/attrs/properties/basis"]'
          [ "$got" = "$want" ] || { echo "::error::v2.0.0 to v2.1.0 node schema: got $got"; exit 1; }
          echo "$got"
          # Every shipped entry is one of these reviewed fixture pairs, and every pair is shipped.
          pair() { jq -cnj --slurpfile o "$data/$1" --slurpfile n "$data/$2" --arg p "$3" \
            '($p | split("/")) as $k | [($o[0] | getpath($k)), ($n[0] | getpath($k))]' | sha256sum | cut -d' ' -f1; }
          fixtures="$( { pair node-v2.0.0.json node-v2.1.0.json properties/measuredAt/pattern
            pair node-v2.0.0.json node-v2.1.0.json properties/attrs/properties/fetched_at/pattern
            pair time-graphs-75e4e77.json time-v2.1.0.json '$defs/time/pattern'; } | sort)"
          shipped="$(jq -r '.[].sha256' <<<"$TIGHTEN" | sort)"
          [ "$fixtures" = "$shipped" ] || { echo "::error::the shipped tightening list and the reviewed fixture pairs differ"; exit 1; }
          echo "shipped tightenings: $(wc -l <<<"$shipped" | tr -d ' '), each a fixture pair"
      - name: Every library has mutants, and each mutant turns a case red
        env:
          YQ: ${{ runner.temp }}/tools/yq/yq_linux_amd64
        run: bash scripts/mutants.sh
      - name: The denylist step on a simulated maintainer merge
        run: bash scripts/denylist-canary.sh

  denylist:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/guard.yml
    with:
      guard: denylist

  removed-paths:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/guard.yml
    with:
      guard: removed-paths
      history: '["CHANGELOG.md","docs/live-proof.md"]'

  release-note:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/guard.yml
    with:
      guard: release-note
      watch: '["consumer/","spec/",".github/workflows/","rulesets/"]'

  schema-loosening:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/guard.yml
    with:
      guard: schema-loosening

  size:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/guard.yml
    with:
      guard: size
      size-fixtures: '["selftest/","examples/","counter-examples/","tests/fixtures/","/README.md","docs/new-repo-checklist.md","/.github/workflows/",".github/automerge-paths.json",".github/CODEOWNERS",".github/dependabot.yml",".github/required-checks.json",".gitleaks.toml","/consumer/","/rulesets/","spec/node/schema.json"]'

  discover:
    name: discover
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      targets-leak-scan: ${{ steps.list.outputs.targets-leak-scan }}
      fixtures-leak-scan: ${{ steps.list.outputs.fixtures-leak-scan }}
      targets-schema-check: ${{ steps.list.outputs.targets-schema-check }}
      fixtures-schema-check: ${{ steps.list.outputs.fixtures-schema-check }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Each check's targets and self-test fixtures
        id: list
        run: bash scripts/discover.sh >> "$GITHUB_OUTPUT"

  leak-scan:
    needs: [discover]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.targets-leak-scan) }}
    uses: ./.github/workflows/leak-scan.yml

  selftest-leak-scan:
    needs: [discover]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.fixtures-leak-scan) }}
    uses: ./.github/workflows/leak-scan.yml
    with:
      _selftest-fixture: ${{ matrix.fixture }}
      _selftest-expect: ${{ matrix.expect }}

  schema-check:
    needs: [discover]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.targets-schema-check) }}
    uses: ./.github/workflows/schema-check.yml
    with:
      schema: ${{ matrix.schema }}
      instances: ${{ matrix.instances }}
      resolve: ${{ matrix.resolve }}
      guards: ${{ matrix.guards }}
      expect: ${{ matrix.expect }}
      each: ${{ matrix.each }}
      mode: ${{ matrix.mode }}
      resolve-ids: ${{ matrix.resolve-ids }}

  selftest-schema-check:
    needs: [discover]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.fixtures-schema-check) }}
    uses: ./.github/workflows/schema-check.yml
    with:
      _selftest-fixture: ${{ matrix.fixture }}
      expect: ${{ matrix.expect }}
      schema: ${{ matrix.schema }}
      instances: ${{ matrix.instances }}
      resolve: ${{ matrix.resolve }}
      guards: ${{ matrix.guards }}
      each: ${{ matrix.each }}
      mode: ${{ matrix.mode }}
      resolve-ids: ${{ matrix.resolve-ids }}

  gate:
    if: always()
    needs: ["render","discover","unit","denylist","removed-paths","release-note","schema-loosening","size","leak-scan","selftest-leak-scan","schema-check","selftest-schema-check"]
    uses: ./.github/workflows/gate.yml
    with:
      needs: ${{ toJSON(needs) }}
