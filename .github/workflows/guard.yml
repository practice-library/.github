# Generated from templates/.github/workflows/guard.yml and policy/constants.json by scripts/render.sh. Do not edit.
name: guard
# Mechanical review checks, one per call: guard is one of denylist, removed-paths, release-note, schema-loosening, size.
#   denylist          no denied term in the added lines, added paths, or commit messages and names;
#                     the list (salted sha256 entries) is read from the base commit; no list fails;
#                     on push, a merge commit's author name is not judged (whoever pressed merge)
#   removed-paths     nothing outside the history files mentions a path the change removed
#   release-note      a change under a watched path changes the changelog or says "Release: none"
#   schema-loosening  a loosened JSON schema (a $schema of json-schema.org) needs the label "schema-loosening-approved" from someone other
#                     than the author and not a bot; the caller's pull_request types include labeled
#   size              (optional, the gate does not require it) the lines added or changed outside
#                     fixtures are at most size-limit, or the label "size-approved" from someone
#                     other than the author and not a bot lets more through
on:
  workflow_call:
    inputs:
      guard:
        description: 'The guard to run: one of denylist, removed-paths, release-note, schema-loosening, size.'
        type: string
        required: true
      denylist:
        description: The denylist file, read from the base commit (or from the change that adds it); the guard fails when there is none.
        type: string
        default: .github/denylist.json
      history:
        description: JSON array of files that may mention removed paths, as a record of the past.
        type: string
        default: '["CHANGELOG.md"]'
      watch:
        description: JSON array of paths whose change needs a changelog entry or the no-release line; an entry ending in / covers everything under it.
        type: string
        default: '[]'
      changelog:
        description: The changelog file.
        type: string
        default: CHANGELOG.md
      label:
        description: The label that lets a loosened schema through.
        type: string
        default: schema-loosening-approved
      size-limit:
        description: size only. The most lines a pull request may add or change outside fixtures.
        type: number
        default: 600
      size-fixtures:
        description: size only. JSON array of fixture entries not counted; an entry starting and ending in / is a directory from the root, any other entry ending in / a directory anywhere in the path, an entry with no / a file name anywhere, any other entry one exact path from the root (a leading / is allowed, so /README.md names only the root file).
        type: string
        default: '["selftest/","examples/","counter-examples/","tests/fixtures/"]'
      size-label:
        description: size only. The label that lets a larger pull request through.
        type: string
        default: size-approved
permissions:
  contents: read
jobs:
  guard:
    name: ${{ inputs.guard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The change to check
        id: range
        shell: bash
        env:
          GUARD: ${{ inputs.guard }}
          GUARDS: '["denylist","removed-paths","release-note","schema-loosening","size"]'
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          jq -en --arg g "$GUARD" --argjson all "$GUARDS" 'any($all[]; . == $g)' > /dev/null \
            || { echo "::error::unknown guard $GUARD; known: $GUARDS"; exit 1; }
          base=""; head=""
          case "$EVENT" in
            pull_request|pull_request_target) base="$PR_BASE"; head="$PR_HEAD" ;;
            push) if [ -n "$PUSH_BEFORE" ] && ! [[ "$PUSH_BEFORE" =~ ^0+$ ]]; then base="$PUSH_BEFORE"; head="$PUSH_AFTER"; fi ;;
          esac
          if [ -z "$base" ]; then echo "none=true" >> "$GITHUB_OUTPUT"; echo "No change to compare on $EVENT."; exit 0; fi
          # The change is what head adds to the point where it left base.
          mb="$(git merge-base "$base" "$head")"
          { echo "none=false"; echo "base=$base"; echo "mb=$mb"; echo "head=$head"; } >> "$GITHUB_OUTPUT"

      - name: denylist
        if: inputs.guard == 'denylist'
        shell: bash
        env:
          NONE: ${{ steps.range.outputs.none }}
          BASE: ${{ steps.range.outputs.base }}
          MB: ${{ steps.range.outputs.mb }}
          HEAD: ${{ steps.range.outputs.head }}
          LIST: ${{ inputs.denylist }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # collect: prints "<where><TAB><text>" for every added line, added path, and commit message, author name
          # and committer name of the change MB..HEAD in the current repository. A name is printed with the where
          # "author <sha>" or "committer <sha>" by a git log of its own, so no message line can pose as a name.
          # Each git read goes to a file first and any failed read makes collect fail, so a change that cannot be
          # read is never judged clean. The content diff is taken with --text and --no-textconv, so no
          # .gitattributes in the change (-diff, binary, a diff driver) can hide a line. Words inside compressed
          # binary files (images, archives) are not visible as text.
          # A "+++ " line is a file header only between "diff --git" and the first "@@"; inside a hunk it is an
          # added line that starts with "++". --no-prefix keeps the path at a fixed place whatever the config;
          # git ends the header with a tab when the path holds a space, and that tab is dropped.
          # EVENT is the GitHub event. On push, the author name of a merge commit is not judged: a merge made in
          # the browser is authored by whoever pressed merge. Its message and committer are judged like any other.
          # On any other event, or when EVENT is unset, every author name is judged.
          collect() {
            local skip=() buf
            if [ "${EVENT:-}" = push ]; then skip=(--no-merges); fi
            buf="$(mktemp)" || return 1
            git diff --text --no-textconv --no-ext-diff --no-color --no-prefix --unified=0 "$MB" "$HEAD" > "$buf" \
              || { rm -f "$buf"; return 1; }
            awk '
              /^diff --git / { hdr = 1; next }
              hdr && /^\+\+\+ / { f = substr($0, 5); sub(/\t$/, "", f); next }
              /^@@/ { hdr = 0; match($0, /\+[0-9]+/); n = substr($0, RSTART + 1, RLENGTH - 1) + 0; next }
              !hdr && /^\+/ { print f ":" n "\t" substr($0, 2); n++ }' "$buf"
            # An added path is reported by its place in the list, since the path may hold the term.
            git diff --name-only --diff-filter=AR --no-ext-diff "$MB" "$HEAD" > "$buf" || { rm -f "$buf"; return 1; }
            awk '{ print "added path " NR "\t" $0 }' "$buf"
            git log ${skip[@]+"${skip[@]}"} --format='author %H%x09%an' "$MB..$HEAD" > "$buf" || { rm -f "$buf"; return 1; }
            cat "$buf"
            git log --format='committer %H%x09%cn' "$MB..$HEAD" > "$buf" || { rm -f "$buf"; return 1; }
            cat "$buf"
            git log --format='::guard-commit:: %H%n%B' "$MB..$HEAD" > "$buf" \
              || { rm -f "$buf"; return 1; }
            awk '
              /^::guard-commit:: / { c = substr($0, 18); next }
              { print "commit " c "\t" $0 }' "$buf"
            rm -f "$buf"
          }

          # main: prints "ok ..." when no line holds a denied term, "found <n> <where>..." when lines do,
          # "unguarded ..." when there is no list or it is empty, or "invalid ..." when DENY cannot be used.
          # The term itself is never printed.
          #   DENY       JSON {"salt": "<text>", "sha256": ["<hex>", ...], "allowAuthorNames": ["<hex>", ...]}: each
          #              sha256 entry is sha256(salt + ":" + term), where a term is one word or two adjacent words,
          #              lower case, words joined by one space; empty when the repository has no list. The optional
          #              allowAuthorNames entries are sha256(salt + ":" + name) of whole names, written the same way:
          #              64 lower-case hex characters each; an author or committer name that is one of them is
          #              not judged. Messages, added lines and added paths are judged whatever the name.
          #   EVENT      the GitHub event; push leaves merge commits out (see collect)
          #   TEXT_FILE  lines "<where><TAB><text>"; when unset, the change MB..HEAD is collected (see collect)
          # A text is cut into words of [a-z0-9]; each word, each two adjacent words, and those two written
          # together are checked. scripts/denylist-hash.sh lists a two-word term both ways ("ab cd" and "abcd"),
          # so "Ab Cd", "ab-cd" and "AbCd" all match it.
          main() {
            if [ -z "${DENY:-}" ]; then echo "unguarded no denylist: add one (scripts/denylist-hash.sh)"; return 0; fi
            if [ -z "${TEXT_FILE:-}" ]; then
              TEXT_FILE="$(mktemp)"
              collect > "$TEXT_FILE" || { echo "invalid the change could not be read"; return 0; }
            fi
            TEXT_FILE="$TEXT_FILE" python3 -I -c '
          import hashlib, json, os, re, sys
          try:
              deny = json.loads(os.environ["DENY"])
              salt = deny["salt"]
              hashes = set(deny["sha256"])
              allow = deny.get("allowAuthorNames", [])
              assert isinstance(salt, str) and salt and isinstance(allow, list)
              allow = set(allow)
              assert all(isinstance(h, str) for h in hashes)
              assert all(re.fullmatch(r"[0-9a-f]{64}", h) for h in allow)
          except Exception:
              print("invalid the denylist must be {\"salt\": text, \"sha256\": [hex, ...], \"allowAuthorNames\": [hex, ...]}")
              sys.exit(0)
          if not hashes:
              print("unguarded the denylist has no entries")
              sys.exit(0)
          def h(term):
              return hashlib.sha256((salt + ":" + term).encode()).hexdigest()
          # A name row is exactly "author <id>" or "committer <id>"; a path or a line in a file named "author x"
          # never is, since its where carries ":<line>" or starts with "added path".
          name_row = re.compile(r"(?:author|committer) (?:[0-9a-f]{40}|[0-9a-f]{64})")
          found = []
          with open(os.environ["TEXT_FILE"], encoding="utf-8", errors="replace") as f:
              for line in f:
                  where, _, text = line.rstrip("\n").partition("\t")
                  words = re.findall(r"[a-z0-9]+", text.lower())
                  if name_row.fullmatch(where) and h(" ".join(words)) in allow:
                      continue
                  terms = set(words)
                  for a, b in zip(words, words[1:]):
                      terms.add(a + " " + b)
                      terms.add(a + b)
                  if any(h(t) in hashes for t in terms):
                      found.append(where)
          if found:
              seen = list(dict.fromkeys(found))
              print("found %d %s" % (len(found), ", ".join(seen[:20])))
          else:
              print("ok no denied term in the change")
          '
          }
          if [ "$NONE" = true ]; then
            # Nothing to compare, but a repository whose list is missing, empty or unreadable is still
            # unguarded: main checks the list against no text at all.
            echo "Nothing to compare; checking $LIST only."
            DENY=""
            if git cat-file -e "HEAD:$LIST" 2>/dev/null; then DENY="$(git cat-file blob "HEAD:$LIST")"; fi
            TEXT_FILE=/dev/null
            export DENY TEXT_FILE
            result="$(main)"
            echo "$result"
            [ "${result%% *}" = ok ]
            exit
          fi
          # The list comes from the base commit, so a change cannot edit the list it is checked against.
          # Only when the base has none and the change adds it is the change's own list used.
          DENY=""
          if git cat-file -e "$BASE:$LIST" 2>/dev/null; then
            DENY="$(git cat-file blob "$BASE:$LIST")"
          elif git cat-file -e "$HEAD:$LIST" 2>/dev/null; then
            echo "$LIST is new in this change; it is checked with that list."
            DENY="$(git cat-file blob "$HEAD:$LIST")"
          fi
          unset TEXT_FILE
          export DENY MB HEAD EVENT
          result="$(main)"
          echo "$result"
          [ "${result%% *}" = ok ]

      - name: removed-paths
        if: inputs.guard == 'removed-paths' && steps.range.outputs.none == 'false'
        shell: bash
        env:
          MB: ${{ steps.range.outputs.mb }}
          HEAD: ${{ steps.range.outputs.head }}
          HISTORY: ${{ inputs.history }}
        run: |
          set -euo pipefail
          # main: prints "ok ..." when nothing in the tree ROOT mentions a path the change removed, otherwise
          # "referenced [{path, at}, ...]".
          #   DELETED  JSON array of paths the change deleted or renamed away
          #   ROOT     the tree after the change
          #   HISTORY  JSON array of files whose mentions are a record of the past and are allowed
          # Besides each removed path, every parent directory that no longer exists is looked for, as "dir/"
          # and as "dir". A mention must not be preceded by a path character, so "x/a.json" is not "a.json".
          main() {
            local terms t esc hits
            if ! jq -en --argjson d "$DELETED" --argjson h "$HISTORY" '($d | type) == "array" and ($h | type) == "array"' > /dev/null 2>&1; then
              echo "invalid DELETED and HISTORY must be JSON arrays"; return 0
            fi
            terms="$(
              jq -r '.[]' <<<"$DELETED" | while IFS= read -r p; do
                [ -n "$p" ] || continue
                printf '%s\n' "$p"
                d="$(dirname "$p")"
                while [ "$d" != . ] && [ "$d" != / ]; do
                  if [ ! -e "$ROOT/$d" ]; then printf '%s/\n%s\n' "$d" "$d"; fi
                  d="$(dirname "$d")"
                done
              done | sort -u | awk '{ print length($0) "\t" $0 }' | sort -rn | cut -f2-
            )"
            hits="$(
              while IFS= read -r t; do
                [ -n "$t" ] || continue
                esc="$(printf '%s' "$t" | sed 's/[][\.*^$+?(){}|/]/\\&/g')"
                grep -rnIE --exclude-dir=.git "(^|[^A-Za-z0-9._/-])${esc}(\$|[^A-Za-z0-9_-])" "$ROOT" 2>/dev/null \
                  | while IFS= read -r m; do
                      file="${m%%:*}"; rest="${m#*:}"; file="${file#"$ROOT"/}"
                      jq -en --arg f "$file" --argjson h "$HISTORY" 'any($h[]; . == $f)' > /dev/null && continue
                      jq -cn --arg p "$t" --arg at "$file:${rest%%:*}" '{path: $p, at: $at}'
                    done
              done <<<"$terms" | jq -sc 'unique_by(.at) | .[:20]'
            )"
            if [ "$hits" = "[]" ]; then echo "ok no removed path is mentioned"; else echo "referenced $hits"; fi
          }
          DELETED="$(git diff --name-status -M --diff-filter=DR --no-ext-diff "$MB" "$HEAD" | awk -F '\t' '{ print $2 }' | jq -Rsc 'split("\n") | map(select(length > 0)) | unique')"
          ROOT="$GITHUB_WORKSPACE"
          export DELETED ROOT HISTORY
          result="$(main)"
          echo "$result"
          [ "${result%% *}" = ok ]

      - name: release-note
        if: inputs.guard == 'release-note' && steps.range.outputs.none == 'false'
        shell: bash
        env:
          MB: ${{ steps.range.outputs.mb }}
          HEAD: ${{ steps.range.outputs.head }}
          WATCH: ${{ inputs.watch }}
          CHANGELOG: ${{ inputs.changelog }}
          MARKER: 'Release: none'
        run: |
          set -euo pipefail
          # main: prints "ok ..." when the change touches no watched path, or adds a line with text to the
          # changelog (a whitespace-only edit does not count), or a commit message holds the marker line;
          # otherwise "missing ...".
          #   CHANGED    JSON array of changed paths, old and new
          #   WATCH      JSON array of watched paths; an entry ending in / covers everything under it
          #   CHANGELOG  the changelog path       MARKER  the line that says no release is needed
          #   MESSAGES   the change's commit messages
          #   CHANGELOG_ADDED  how many lines the change adds to the changelog that hold a non-space character
          main() {
            local touched
            [[ "${CHANGELOG_ADDED:-}" =~ ^[0-9]+$ ]] || { echo "invalid CHANGELOG_ADDED must be a count"; return 0; }
            if ! touched="$(jq -c --argjson w "$WATCH" '
                [.[] | select(. as $f | any($w[]; . as $p
                  | if ($p | endswith("/")) then ($f | startswith($p)) else $f == $p end))] | unique' <<<"$CHANGED" 2>/dev/null)"; then
              echo "invalid CHANGED and WATCH must be JSON arrays"; return 0
            fi
            if [ "$touched" = "[]" ]; then echo "ok no watched path changed"; return 0; fi
            if [ "$CHANGELOG_ADDED" -gt 0 ] && jq -en --arg c "$CHANGELOG" --argjson f "$CHANGED" 'any($f[]; . == $c)' > /dev/null; then
              echo "ok $CHANGELOG has $CHANGELOG_ADDED added lines"; return 0
            fi
            if printf '%s\n' "$MESSAGES" | sed 's/[[:space:]]*$//' | grep -qxF -- "$MARKER"; then
              echo "ok a commit message says: $MARKER"; return 0
            fi
            echo "missing $touched changed, but neither $CHANGELOG nor a \"$MARKER\" line in a commit message"
          }
          CHANGED="$(git diff --name-status -M --no-ext-diff "$MB" "$HEAD" | cut -f2- | tr '\t' '\n' | jq -Rsc 'split("\n") | map(select(length > 0)) | unique')"
          MESSAGES="$(git log --format='%B' "$MB..$HEAD")"
          # Added lines of the changelog that hold text; a whitespace-only edit adds none.
          CHANGELOG_ADDED="$(git diff -w --ignore-blank-lines --no-ext-diff --no-color --unified=0 "$MB" "$HEAD" -- "$CHANGELOG" \
            | { grep -E '^\+' | grep -vE '^\+\+\+ ' | grep -cE '^\+.*[^[:space:]]' || true; })"
          export CHANGED MESSAGES CHANGELOG_ADDED
          result="$(main)"
          echo "$result"
          [ "${result%% *}" = ok ]

      - name: schema-loosening
        if: inputs.guard == 'schema-loosening' && steps.range.outputs.none == 'false'
        shell: bash
        env:
          MB: ${{ steps.range.outputs.mb }}
          HEAD: ${{ steps.range.outputs.head }}
          # Reviewed pattern changes that only tighten, shipped with this workflow at its pin.
          TIGHTEN: '[{"sha256":"7663e1bec8c96806db4767e51a62f6277cb32c33f31ef220b58e1e38c368fc2e","why":"v2.1.0 node measuredAt: any YYYY-MM-DD becomes a real calendar date"},{"sha256":"b3f86a4733165b4c53c2522ac953dc11eddb93189459f76af87f876f23d52983","why":"v2.1.0 node attrs.fetched_at: any text ending in Z becomes a real UTC date-time ending in Z"},{"sha256":"ac72432b0442a01bda943d78218bfb26c30cbb525aa82869035e4d4fa0b9bf4d","why":"v2.1.0 refresh-report and sources defs.time (moved from practice-library/graphs): the same time of day, on a real calendar date"}]'
          LABEL: ${{ inputs.label }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # main: judges one changed JSON file. OLD_FILE is the file on the base commit; NEW_FILE the file on the
          # head, or empty when the change deleted it. Prints "invalid ..." when OLD_FILE cannot be read, "skip ..."
          # when it is not a JSON schema (its top-level $schema does not name a json-schema.org meta-schema, as an
          # instance pointing at its own schema does not), loose ["(deleted)"] when a schema was deleted, and
          # otherwise what compare prints.
          main() {
            [ -r "${OLD_FILE:-}" ] || { echo "invalid cannot read the base file"; return 0; }
            if ! jq -e 'type == "object" and ((.["$schema"] // "") | type == "string" and test("^https?://json-schema\\.org/"))' "$OLD_FILE" > /dev/null 2>&1; then
              echo "skip not a JSON schema"; return 0
            fi
            if [ -z "${NEW_FILE:-}" ]; then echo 'loose ["(deleted)"]'; return 0; fi
            compare
          }

          # compare: prints "ok ..." when the schema in NEW_FILE accepts nothing more than the one in OLD_FILE by
          # the rules below, otherwise "loose [<path>, ...]". Rules, at every place in the schema:
          #   a minimum (minItems, minLength, minProperties, minimum, exclusiveMinimum, minContains) lowered or removed;
          #   a maximum (maxItems, maxLength, maxProperties, maximum, exclusiveMaximum, maxContains) raised or removed;
          #   a required entry removed; an enum value added; additionalProperties false made anything else;
          #   const, pattern or format changed or removed.
          # A pattern changed to another string is not loose when the pair is listed in TIGHTEN (unset means no
          # list): a JSON array of {"sha256": <64 lower-case hex>, "why": <text>}, each the SHA-256 of the pair
          # written as compact JSON, ["<old pattern>","<new pattern>"], with no newline. A list entry is a reviewed
          # claim that the new pattern accepts nothing the old one refused. A malformed list prints "invalid", so
          # nothing passes on a list that cannot be read; a removed pattern, or a pair not listed, stays loose.
          compare() {
            local out list entry path pair hash loose="[]" tightened="[]"
            list="${TIGHTEN-[]}"
            if ! jq -se 'length == 1 and (.[0] | type == "array" and all(.[]; type == "object" and (.sha256 | type == "string" and test("^[0-9a-f]{64}$")) and (.why | type == "string" and length > 0)))' <<<"$list" > /dev/null 2>&1; then
              echo "invalid TIGHTEN must be a JSON array of {sha256, why}"; return 0
            fi
            if ! out="$(jq -cn --slurpfile o "$OLD_FILE" --slurpfile n "$NEW_FILE" '
                $o[0] as $old | $n[0] as $new
                | ["minItems","minLength","minProperties","minimum","exclusiveMinimum","minContains"] as $mins
                | ["maxItems","maxLength","maxProperties","maximum","exclusiveMaximum","maxContains"] as $maxs
                | [ $old | paths | select(length > 0 and (.[-1] | type) == "string") ] as $ps
                | [ $ps[] as $p
                    | $p[-1] as $k
                    | ($old | getpath($p)) as $ov
                    | ($new | try getpath($p) catch null) as $nv
                    | select(
                        if ($mins | index([$k])) != null and ($ov | type) == "number" then ($nv | type) != "number" or $nv < $ov
                        elif ($maxs | index([$k])) != null and ($ov | type) == "number" then ($nv | type) != "number" or $nv > $ov
                        elif $k == "required" and ($ov | type) == "array" then
                          ($nv | if type == "array" then . else [] end) as $nr | any($ov[]; . as $x | ($nr | index([$x])) == null)
                        elif $k == "enum" and ($ov | type) == "array" then
                          ($nv | type) != "array" or any($nv[]; . as $x | ($ov | index([$x])) == null)
                        elif $k == "additionalProperties" and $ov == false then $nv != false
                        elif $k == "const" or (($k == "pattern" or $k == "format") and ($ov | type) == "string") then $nv != $ov
                        else false end)
                    | {path: ($p | map(tostring) | join("/")),
                       pair: (if $k == "pattern" and ($ov | type) == "string" and ($nv | type) == "string" then [$ov, $nv] else null end)} ]' 2>/dev/null)"; then
              echo "invalid both files must be JSON"; return 0
            fi
            while IFS= read -r entry; do
              path="$(jq -r '.path' <<<"$entry")"
              pair="$(jq -cj '.pair' <<<"$entry")"
              if [ "$pair" != null ]; then
                hash="$(printf '%s' "$pair" | { sha256sum 2>/dev/null || shasum -a 256; } | cut -d' ' -f1)"
                if jq -e --arg h "$hash" 'any(.[]; .sha256 == $h)' <<<"$list" > /dev/null; then
                  tightened="$(jq -c --arg p "$path" '. + [$p]' <<<"$tightened")"; continue
                fi
              fi
              loose="$(jq -c --arg p "$path" '. + [$p]' <<<"$loose")"
            done < <(jq -c '.[]' <<<"$out")
            if [ "$loose" != "[]" ]; then echo "loose $loose"
            elif [ "$tightened" != "[]" ]; then echo "ok nothing loosened; listed tightenings $tightened"
            else echo "ok nothing loosened"; fi
          }
          loose="[]"
          while IFS=$'\t' read -r status old new; do
            new="${new:-$old}"
            OLD_FILE="$RUNNER_TEMP/old.json"; NEW_FILE="$RUNNER_TEMP/new.json"
            git cat-file blob "$MB:$old" > "$OLD_FILE" || { echo "::error file=$old::cannot read $old on the base"; exit 1; }
            # A deleted schema accepts everything it used to refuse, so it counts as loosened.
            if [ "$status" = D ]; then NEW_FILE=""
            else git cat-file blob "$HEAD:$new" > "$NEW_FILE" || { echo "::error file=$new::cannot read $new on the head"; exit 1; }; fi
            export OLD_FILE NEW_FILE
            result="$(main)"
            echo "$new: $result"
            case "$result" in
              ok*|skip*) ;;
              loose*) loose="$(jq -c --arg f "$new" --argjson p "${result#loose }" '. + [$p[] | $f + "#/" + .]' <<<"$loose")" ;;
              *) echo "::error file=$new::$result"; exit 1 ;;
            esac
          done < <(git diff --name-status -M --diff-filter=MRD --no-ext-diff "$MB" "$HEAD" -- '*.json' | sed -E 's/^R[0-9]*/R/')
          if [ "$loose" = "[]" ]; then echo "ok no schema loosened"; exit 0; fi
          echo "loosened: $loose"
          if [ -z "$NUMBER" ]; then echo "ok not a pull request; loosening is judged on the pull request"; exit 0; fi
          # main: prints "ok approved by <login>" when the pull request carries LABEL and the last person to add
          # it is neither the author nor a bot; "missing ..." when the label is not on the pull request; otherwise
          # "refused ..." (added by the author, by a bot, or by no one the events show). Who added it last counts,
          # so removing it and adding it again changes the verdict.
          #   LABEL   the approval label
          #   LABELS  JSON array of the labels on the pull request now
          #   AUTHOR  the pull request author's login
          #   EVENTS  one line per time LABEL was added, oldest first: "<login><TAB><actor type>"
          main() {
            local last login type
            if ! jq -en --arg l "$LABEL" --argjson ls "$LABELS" '($ls | type) == "array" and any($ls[]; . == $l)' > /dev/null 2>&1; then
              if jq -en --argjson ls "$LABELS" '($ls | type) == "array"' > /dev/null 2>&1; then
                echo "missing the label $LABEL is not on the pull request"; return 0
              fi
              echo "refused LABELS must be a JSON array"; return 0
            fi
            last="$(printf '%s\n' "${EVENTS:-}" | awk 'NF { l = $0 } END { print l }')"
            if [ -z "$last" ] || [[ "$last" != *$'\t'* ]]; then
              echo "refused no event shows who added $LABEL"; return 0
            fi
            login="${last%%$'\t'*}"; type="${last#*$'\t'}"
            if [ -z "$login" ] || [ "$login" = "$AUTHOR" ] || [ "$type" = Bot ] || [[ "$login" == *"[bot]" ]]; then
              echo "refused $LABEL must be added by someone other than the author and not by a bot (last added by: ${login:-unknown})"; return 0
            fi
            echo "ok approved by $login"
          }
          EVENTS="$(gh api --paginate "repos/$REPO/issues/$NUMBER/events" \
                --jq ".[] | select(.event == \"labeled\" and .label.name == \"$LABEL\") | [.actor.login, .actor.type] | @tsv")" \
            || { echo "::error::cannot read the label events of #$NUMBER"; exit 1; }
          export LABEL LABELS AUTHOR EVENTS
          verdict="$(main)"
          case "$verdict" in
            ok*) echo "ok loosening accepted: ${verdict#ok }" ;;
            missing*) echo "::error::a schema is loosened; a maintainer reviews it and adds the label $LABEL"; exit 1 ;;
            *) echo "::error::${verdict#refused }"; exit 1 ;;
          esac

      - name: size
        if: inputs.guard == 'size' && steps.range.outputs.none == 'false'
        shell: bash
        env:
          MB: ${{ steps.range.outputs.mb }}
          HEAD: ${{ steps.range.outputs.head }}
          LIMIT: ${{ inputs.size-limit }}
          FIXTURES: ${{ inputs.size-fixtures }}
          LABEL: ${{ inputs.size-label }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # main: prints "ok <n> non-fixture lines (limit <L>)" when the lines the change adds or changes outside
          # fixtures are at most LIMIT, "over <n> non-fixture lines, more than <L>: split the pull request" when
          # they are more, or "invalid ..." when an input cannot be used.
          #   NUMSTAT   output of git diff --numstat -M: "<added><TAB><deleted><TAB><path>", a rename written as
          #             "<old> => <new>" or "<dir>/{<old> => <new>}/<rest>"; a binary file shows "-" and counts 0.
          #             When NUMSTAT is unset, main reads it from git for MB..HEAD with the repository's own
          #             .gitattributes ignored, so a change cannot mark its text files binary to hide them.
          #   FIXTURES  JSON array of fixture entries. An entry starting and ending in / is a directory from the
          #             root ("/rulesets/"); any other entry ending in / is a directory anywhere in the path
          #             ("examples/" covers spec/x/examples/a.json); an entry with no / is a file name anywhere
          #             ("INDEX.md"); any other entry is one exact path from the root, a leading / allowed.
          #   LIMIT     the most non-fixture lines that pass, a whole number
          # A changed line counts once, as an added line; a renamed file counts by its new path, once.
          main() {
            [[ "${LIMIT:-}" =~ ^[0-9]+$ ]] || { echo "invalid LIMIT must be a whole number"; return 0; }
            jq -en --argjson f "${FIXTURES:-null}" '($f | type) == "array" and all($f[]; type == "string" and length > 0)' > /dev/null 2>&1 \
              || { echo "invalid FIXTURES must be a JSON array of non-empty strings"; return 0; }
            local n
            if [ -z "${NUMSTAT+x}" ]; then
              NUMSTAT="$(git --attr-source="$(git hash-object -t tree /dev/null)" diff --numstat -M --no-ext-diff --no-textconv "$MB" "$HEAD")" \
                || { echo "invalid the diff could not be read"; return 0; }
            fi
            if ! n="$(printf '%s\n' "${NUMSTAT:-}" | jq -R --argjson f "$FIXTURES" -n '
                def newpath:
                  if test("\\{.* => .*\\}") then sub("\\{(?<a>[^{}]*) => (?<b>[^{}]*)\\}"; "\(.b)") | gsub("//"; "/")
                  elif test(" => ") then sub("^.* => "; "") else . end;
                def fixture($p):
                  any($f[]; . as $e
                    | if ($e | startswith("/")) and ($e | endswith("/")) then ($p | startswith($e | ltrimstr("/")))
                      elif ($e | endswith("/")) then (("/" + $p) | contains("/" + $e))
                      elif ($e | contains("/")) then $p == ($e | ltrimstr("/"))
                      else ($p | split("/") | last) == $e end);
                [inputs | select(length > 0) | split("\t")
                  | if length < 3 or (.[0] | test("^([0-9]+|-)$") | not) then error("bad numstat line: " + join("\t")) else . end
                  | {added: (if .[0] == "-" then 0 else (.[0] | tonumber) end), path: (.[2:] | join("\t") | newpath)}
                  | select(fixture(.path) | not) | .added] | add // 0' 2>/dev/null)"; then
              echo "invalid NUMSTAT is not git diff --numstat output"; return 0
            fi
            if [ "$n" -le "$LIMIT" ]; then echo "ok $n non-fixture lines (limit $LIMIT)"
            else echo "over $n non-fixture lines, more than $LIMIT: split the pull request"; fi
          }
          export LIMIT FIXTURES MB HEAD
          result="$(main)"
          echo "$result"
          case "$result" in
            ok*) exit 0 ;;
            over*) ;;
            *) echo "::error::$result"; exit 1 ;;
          esac
          if [ -z "$NUMBER" ]; then echo "ok not a pull request; size is judged on the pull request"; exit 0; fi
          unset -f main
          # main: prints "ok approved by <login>" when the pull request carries LABEL and the last person to add
          # it is neither the author nor a bot; "missing ..." when the label is not on the pull request; otherwise
          # "refused ..." (added by the author, by a bot, or by no one the events show). Who added it last counts,
          # so removing it and adding it again changes the verdict.
          #   LABEL   the approval label
          #   LABELS  JSON array of the labels on the pull request now
          #   AUTHOR  the pull request author's login
          #   EVENTS  one line per time LABEL was added, oldest first: "<login><TAB><actor type>"
          main() {
            local last login type
            if ! jq -en --arg l "$LABEL" --argjson ls "$LABELS" '($ls | type) == "array" and any($ls[]; . == $l)' > /dev/null 2>&1; then
              if jq -en --argjson ls "$LABELS" '($ls | type) == "array"' > /dev/null 2>&1; then
                echo "missing the label $LABEL is not on the pull request"; return 0
              fi
              echo "refused LABELS must be a JSON array"; return 0
            fi
            last="$(printf '%s\n' "${EVENTS:-}" | awk 'NF { l = $0 } END { print l }')"
            if [ -z "$last" ] || [[ "$last" != *$'\t'* ]]; then
              echo "refused no event shows who added $LABEL"; return 0
            fi
            login="${last%%$'\t'*}"; type="${last#*$'\t'}"
            if [ -z "$login" ] || [ "$login" = "$AUTHOR" ] || [ "$type" = Bot ] || [[ "$login" == *"[bot]" ]]; then
              echo "refused $LABEL must be added by someone other than the author and not by a bot (last added by: ${login:-unknown})"; return 0
            fi
            echo "ok approved by $login"
          }
          EVENTS="$(gh api --paginate "repos/$REPO/issues/$NUMBER/events" \
                --jq ".[] | select(.event == \"labeled\" and .label.name == \"$LABEL\") | [.actor.login, .actor.type] | @tsv")" \
            || { echo "::error::cannot read the label events of #$NUMBER"; exit 1; }
          export LABEL LABELS AUTHOR EVENTS
          verdict="$(main)"
          case "$verdict" in
            ok*) echo "ok larger pull request accepted: ${verdict#ok }" ;;
            missing*) echo "::error::${result#over }; or a maintainer adds the label $LABEL"; exit 1 ;;
            *) echo "::error::${verdict#refused }"; exit 1 ;;
          esac
