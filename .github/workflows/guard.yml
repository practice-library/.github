# Generated from templates/.github/workflows/guard.yml and policy/constants.json by scripts/render.sh. Do not edit.
name: guard
# Mechanical review checks, one per call: guard is one of denylist, removed-paths, release-note, schema-loosening, size.
#   denylist          no denied term in the added lines, added paths, or commit messages and names;
#                     the list (salted sha256 entries) is read from the base commit; no list fails;
#                     on push, a merge commit's author name is not judged (whoever pressed merge);
#                     an exemptPaths entry the change adds or widens needs the label "schema-loosening-approved"
#   removed-paths     nothing outside the history files mentions a path the change removed
#   release-note      a change under a watched path changes the changelog or says "Release: none"
#   schema-loosening  a loosened JSON schema (a $schema of json-schema.org) needs the label "schema-loosening-approved" from someone other
#                     than the author and not a bot; the caller's pull_request types include labeled
#   size              (optional, the gate does not require it) the lines added or changed outside
#                     fixtures are at most size-limit, or the label "size-approved" from someone
#                     other than the author and not a bot lets more through
on:
  workflow_call:
    inputs:
      guard:
        description: 'The guard to run: one of denylist, removed-paths, release-note, schema-loosening, size.'
        type: string
        required: true
      denylist:
        description: The denylist file, read from the base commit (or from the change that adds it); the guard fails when there is none.
        type: string
        default: .github/denylist.json
      history:
        description: JSON array of files that may mention removed paths, as a record of the past.
        type: string
        default: '["CHANGELOG.md"]'
      watch:
        description: JSON array of paths whose change needs a changelog entry or the no-release line; an entry ending in / covers everything under it.
        type: string
        default: '[]'
      changelog:
        description: The changelog file.
        type: string
        default: CHANGELOG.md
      label:
        description: The label that lets a loosened schema, or a denylist exemption added or widened, through.
        type: string
        default: schema-loosening-approved
      size-limit:
        description: size only. The most lines a pull request may add or change outside fixtures.
        type: number
        default: 600
      size-fixtures:
        description: size only. JSON array of fixture entries not counted; an entry starting and ending in / is a directory from the root, any other entry ending in / a directory anywhere in the path, an entry with no / a file name anywhere, any other entry one exact path from the root (a leading / is allowed, so /README.md names only the root file).
        type: string
        default: '["selftest/","examples/","counter-examples/","tests/fixtures/"]'
      size-label:
        description: size only. The label that lets a larger pull request through.
        type: string
        default: size-approved
permissions:
  contents: read
jobs:
  guard:
    name: ${{ inputs.guard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      # Checks out this repository's tooling at the commit that defines the running job, beside the caller's
      # checkout, and makes PRACTICE_CI (the launcher) and CALLER_ROOT available to the later steps.
      # job.workflow_repository and job.workflow_sha exist on GitHub.com only; both are judged before checkout,
      # since an empty repository or ref would make checkout pick the caller or its default branch.
      - name: The workflow's own repository and commit
        shell: bash
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          # main: judges the identity of the workflow that defines the running job, before anything is checked
          # out with it. Prints "ok <repository>@<sha>" when both are usable, otherwise "invalid <why>". Nothing
          # is defaulted: actions/checkout reads an empty repository as the caller and an empty ref as the default
          # branch, so an empty or malformed identity must stop the job here instead of selecting other code.
          #   WORKFLOW_REPOSITORY  job.workflow_repository: owner/name
          #   WORKFLOW_SHA         job.workflow_sha: the full commit, 40 lower-case hex characters
          main() {
            local repo="${WORKFLOW_REPOSITORY:-}" sha="${WORKFLOW_SHA:-}"
            if [ -z "$repo" ]; then echo "invalid job.workflow_repository is empty (this needs GitHub.com)"; return 0; fi
            if ! [[ "$repo" =~ ^[A-Za-z0-9-]+/[A-Za-z0-9._-]+$ ]] || [[ "$repo" == */. ]] || [[ "$repo" == */.. ]]; then
              echo "invalid job.workflow_repository is not owner/name"; return 0
            fi
            if [ -z "$sha" ]; then echo "invalid job.workflow_sha is empty (this needs GitHub.com)"; return 0; fi
            if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then echo "invalid job.workflow_sha is not 40 lower-case hex characters"; return 0; fi
            echo "ok $repo@$sha"
          }
          verdict="$(main)"
          echo "$verdict"
          [ "$verdict" = "ok $WORKFLOW_REPOSITORY@$WORKFLOW_SHA" ] || { echo "::error::${verdict#* }; nothing is checked out"; exit 1; }
      - name: Check out the tooling at the workflow's own commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: practice-ci
          persist-credentials: false
          submodules: false
          lfs: false
      - name: The tooling is exactly that commit
        shell: bash
        env:
          TOOLING: ${{ github.workspace }}/practice-ci
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          LAUNCHER: tooling/practice-ci
        run: |
          set -euo pipefail
          # main: judges the tooling checkout before anything in it runs. Prints "ok <sha>" when the repository in
          # TOOLING is at exactly WORKFLOW_SHA and holds the launcher; "mismatch ..." when HEAD is another commit;
          # "bootstrap ..." when that commit has no launcher (a commit from before the tooling existed: pin a
          # release that ships it, nothing is fetched from elsewhere); "invalid ..." when TOOLING is no repository.
          #   TOOLING       the directory the workflow's own commit was checked out into
          #   WORKFLOW_SHA  job.workflow_sha
          #   LAUNCHER      the launcher's path inside TOOLING
          main() {
            local head
            if ! head="$(git -C "${TOOLING:-}" rev-parse --verify --quiet HEAD^{commit} 2>/dev/null)"; then
              echo "invalid ${TOOLING:-(unset)} is not a checked-out repository"; return 0
            fi
            if [ "$head" != "${WORKFLOW_SHA:-}" ]; then
              echo "mismatch the tooling checkout is at $head, not job.workflow_sha ${WORKFLOW_SHA:-(unset)}"; return 0
            fi
            if [ -z "${LAUNCHER:-}" ] || [ ! -f "$TOOLING/$LAUNCHER" ]; then
              echo "bootstrap $head has no ${LAUNCHER:-launcher}: this commit predates the tooling, so pin a release that ships it"; return 0
            fi
            echo "ok $head"
          }
          verdict="$(main)"
          echo "$verdict"
          [ "$verdict" = "ok $WORKFLOW_SHA" ] || { echo "::error::${verdict#* }"; exit 1; }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.12.16
      - name: The tooling's interpreter
        shell: bash
        env:
          TOOLING: ${{ github.workspace }}/practice-ci
          CALLER: ${{ github.workspace }}/caller
          LAUNCHER: tooling/practice-ci
        run: |
          set -euo pipefail
          "$TOOLING/$LAUNCHER" version
          { echo "PRACTICE_CI=$TOOLING/$LAUNCHER"; echo "CALLER_ROOT=$CALLER"; } >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: caller
          fetch-depth: 0
          persist-credentials: false
      - name: The change to check
        id: range
        shell: bash
        working-directory: caller
        env:
          GUARD: ${{ inputs.guard }}
          GUARDS: '["denylist","removed-paths","release-note","schema-loosening","size"]'
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          jq -en --arg g "$GUARD" --argjson all "$GUARDS" 'any($all[]; . == $g)' > /dev/null \
            || { echo "::error::unknown guard $GUARD; known: $GUARDS"; exit 1; }
          base=""; head=""
          case "$EVENT" in
            pull_request|pull_request_target) base="$PR_BASE"; head="$PR_HEAD" ;;
            push) if [ -n "$PUSH_BEFORE" ] && ! [[ "$PUSH_BEFORE" =~ ^0+$ ]]; then base="$PUSH_BEFORE"; head="$PUSH_AFTER"; fi ;;
          esac
          if [ -z "$base" ]; then echo "none=true" >> "$GITHUB_OUTPUT"; echo "No change to compare on $EVENT."; exit 0; fi
          # The change is what head adds to the point where it left base.
          mb="$(git merge-base "$base" "$head")"
          { echo "none=false"; echo "base=$base"; echo "mb=$mb"; echo "head=$head"; } >> "$GITHUB_OUTPUT"

      - name: denylist
        if: inputs.guard == 'denylist'
        shell: bash
        working-directory: caller
        env:
          NONE: ${{ steps.range.outputs.none }}
          BASE: ${{ steps.range.outputs.base }}
          MB: ${{ steps.range.outputs.mb }}
          HEAD: ${{ steps.range.outputs.head }}
          LIST: ${{ inputs.denylist }}
          EVENT: ${{ github.event_name }}
          LABEL: ${{ inputs.label }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Which list judges the change, the scan, the list the change leaves behind and the approval of
          # an added or widened exemption: tooling/practice_ci/denylist.py.
          "$PRACTICE_CI" guard denylist --root "$CALLER_ROOT"

      - name: removed-paths
        if: inputs.guard == 'removed-paths' && steps.range.outputs.none == 'false'
        shell: bash
        working-directory: caller
        env:
          MB: ${{ steps.range.outputs.mb }}
          HEAD: ${{ steps.range.outputs.head }}
          HISTORY: ${{ inputs.history }}
        run: |
          set -euo pipefail
          DELETED="$(git diff --name-status -M --diff-filter=DR --no-ext-diff "$MB" "$HEAD" | awk -F '\t' '{ print $2 }' | jq -Rsc 'split("\n") | map(select(length > 0)) | unique')"
          # The caller's tree only: the tooling checkout beside it is never scanned.
          ROOT="$CALLER_ROOT"
          export DELETED ROOT HISTORY
          "$PRACTICE_CI" fragment removed-refs --root "$CALLER_ROOT"

      - name: release-note
        if: inputs.guard == 'release-note' && steps.range.outputs.none == 'false'
        shell: bash
        working-directory: caller
        env:
          MB: ${{ steps.range.outputs.mb }}
          HEAD: ${{ steps.range.outputs.head }}
          WATCH: ${{ inputs.watch }}
          CHANGELOG: ${{ inputs.changelog }}
          MARKER: 'Release: none'
        run: |
          set -euo pipefail
          CHANGED="$(git diff --name-status -M --no-ext-diff "$MB" "$HEAD" | cut -f2- | tr '\t' '\n' | jq -Rsc 'split("\n") | map(select(length > 0)) | unique')"
          MESSAGES="$(git log --format='%B' "$MB..$HEAD")"
          export CHANGED MESSAGES MB HEAD
          "$PRACTICE_CI" fragment release-note --root "$CALLER_ROOT"

      - name: schema-loosening
        if: inputs.guard == 'schema-loosening' && steps.range.outputs.none == 'false'
        shell: bash
        working-directory: caller
        env:
          MB: ${{ steps.range.outputs.mb }}
          HEAD: ${{ steps.range.outputs.head }}
          # Reviewed pattern changes that only tighten, shipped with this workflow at its pin.
          TIGHTEN: '[{"sha256":"7663e1bec8c96806db4767e51a62f6277cb32c33f31ef220b58e1e38c368fc2e","why":"v2.1.0 node measuredAt: any YYYY-MM-DD becomes a real calendar date"},{"sha256":"b3f86a4733165b4c53c2522ac953dc11eddb93189459f76af87f876f23d52983","why":"v2.1.0 node attrs.fetched_at: any text ending in Z becomes a real UTC date-time ending in Z"},{"sha256":"ac72432b0442a01bda943d78218bfb26c30cbb525aa82869035e4d4fa0b9bf4d","why":"v2.1.0 refresh-report and sources defs.time (moved from practice-library/graphs): the same time of day, on a real calendar date"}]'
          LABEL: ${{ inputs.label }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          one="$RUNNER_TEMP/schema-loosening.json"
          loose="[]"
          while IFS=$'\t' read -r status old new; do
            new="${new:-$old}"
            OLD_FILE="$RUNNER_TEMP/old.json"; NEW_FILE="$RUNNER_TEMP/new.json"
            git cat-file blob "$MB:$old" > "$OLD_FILE" || { echo "::error file=$old::cannot read $old on the base"; exit 1; }
            # A deleted schema accepts everything it used to refuse, so it counts as loosened.
            if [ "$status" = D ]; then NEW_FILE=""
            else git cat-file blob "$HEAD:$new" > "$NEW_FILE" || { echo "::error file=$new::cannot read $new on the head"; exit 1; }; fi
            export OLD_FILE NEW_FILE
            echo "$new:"
            "$PRACTICE_CI" fragment schema-loosening --root "$CALLER_ROOT" --result "$one" --keep-going
            case "$(jq -r '.reason' "$one")" in
              schema-loosening.ok|schema-loosening.skip) ;;
              schema-loosening.loose) loose="$(jq -c --arg f "$new" --argjson p "$(jq -r '.detail' "$one")" '. + [$p[] | $f + "#/" + .]' <<<"$loose")" ;;
              *) echo "::error file=$new::$(jq -r '.message' "$one")"; exit 1 ;;
            esac
          done < <(git diff --name-status -M --diff-filter=MRD --no-ext-diff "$MB" "$HEAD" -- '*.json' | sed -E 's/^R[0-9]*/R/')
          if [ "$loose" = "[]" ]; then echo "ok no schema loosened"; exit 0; fi
          echo "loosened: $loose"
          if [ -z "$NUMBER" ]; then echo "ok not a pull request; loosening is judged on the pull request"; exit 0; fi
          export LABEL LABELS AUTHOR NUMBER REPO
          verdict="$RUNNER_TEMP/approval.json"
          "$PRACTICE_CI" approval --root "$CALLER_ROOT" --result "$verdict" --keep-going
          case "$(jq -r '.reason' "$verdict")" in
            label-approval.ok) echo "ok loosening accepted: $(jq -r '.detail' "$verdict")" ;;
            label-approval.missing) echo "::error::a schema is loosened; a maintainer reviews it and adds the label $LABEL"; exit 1 ;;
            *) echo "::error::$(jq -r '.message' "$verdict")"; exit 1 ;;
          esac

      - name: size
        if: inputs.guard == 'size' && steps.range.outputs.none == 'false'
        shell: bash
        working-directory: caller
        env:
          MB: ${{ steps.range.outputs.mb }}
          HEAD: ${{ steps.range.outputs.head }}
          LIMIT: ${{ inputs.size-limit }}
          FIXTURES: ${{ inputs.size-fixtures }}
          LABEL: ${{ inputs.size-label }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export LIMIT FIXTURES MB HEAD
          counted="$RUNNER_TEMP/size.json"
          "$PRACTICE_CI" fragment size-count --root "$CALLER_ROOT" --result "$counted" --keep-going
          case "$(jq -r '.reason' "$counted")" in
            size-count.ok) exit 0 ;;
            size-count.over) ;;
            *) echo "::error::$(jq -r '.message' "$counted")"; exit 1 ;;
          esac
          if [ -z "$NUMBER" ]; then echo "ok not a pull request; size is judged on the pull request"; exit 0; fi
          export LABEL LABELS AUTHOR NUMBER REPO
          verdict="$RUNNER_TEMP/approval.json"
          "$PRACTICE_CI" approval --root "$CALLER_ROOT" --result "$verdict" --keep-going
          case "$(jq -r '.reason' "$verdict")" in
            label-approval.ok) echo "ok larger pull request accepted: $(jq -r '.detail' "$verdict")" ;;
            label-approval.missing) echo "::error::$(jq -r '.detail' "$counted"); or a maintainer adds the label $LABEL"; exit 1 ;;
            *) echo "::error::$(jq -r '.message' "$verdict")"; exit 1 ;;
          esac
