# Generated from templates/.github/workflows/guard.yml and policy/constants.json by scripts/render.sh. Do not edit.
name: guard
# Mechanical review checks, one per call: guard is one of denylist, removed-paths, release-note, schema-loosening, size.
#   denylist          no denied term in the added lines, added paths, or commit messages and names;
#                     the list (salted sha256 entries) is read from the base commit; no list fails;
#                     on push, a merge commit's author name is not judged (whoever pressed merge);
#                     an exemptPaths entry the change adds or widens needs an approval of the exact head
#   removed-paths     nothing outside the history files mentions a path the change removed
#   release-note      a change under a watched path changes the changelog or says "Release: none"
#   schema-loosening  a loosened JSON schema (a $schema of json-schema.org) needs an approval of the exact head
#   size              (optional, the gate does not require it) the lines added or changed outside
#                     fixtures are at most size-limit, or an approval of the exact head lets more through
# An approval is a review in state APPROVED on the current head commit, by a maintainer or admin who is not
# the author and not a bot (tooling/practice_ci/approvals.py). A new push needs a new approval. The labels
# "schema-loosening-approved" and "size-approved" only re-run the check; they authorize nothing.
on:
  workflow_call:
    inputs:
      guard:
        description: 'The guard to run: one of denylist, removed-paths, release-note, schema-loosening, size.'
        type: string
        required: true
      denylist:
        description: The denylist file, read from the base commit (or from the change that adds it); the guard fails when there is none.
        type: string
        default: .github/denylist.json
      history:
        description: JSON array of files that may mention removed paths, as a record of the past.
        type: string
        default: '["CHANGELOG.md"]'
      watch:
        description: JSON array of paths whose change needs a changelog entry or the no-release line; an entry ending in / covers everything under it.
        type: string
        default: '[]'
      changelog:
        description: The changelog file.
        type: string
        default: CHANGELOG.md
      label:
        description: The label a maintainer adds to re-run the check after approving a loosened schema, or a denylist exemption added or widened. Only a review approving the head authorizes.
        type: string
        default: schema-loosening-approved
      size-limit:
        description: size only. The most lines a pull request may add or change outside fixtures.
        type: number
        default: 600
      size-fixtures:
        description: size only. JSON array of fixture entries not counted; an entry starting and ending in / is a directory from the root, any other entry ending in / a directory anywhere in the path, an entry with no / a file name anywhere, any other entry one exact path from the root (a leading / is allowed, so /README.md names only the root file).
        type: string
        default: '["selftest/","examples/","counter-examples/","tests/fixtures/"]'
      size-label:
        description: size only. The label a maintainer adds to re-run the check after approving a larger pull request. Only a review approving the head authorizes.
        type: string
        default: size-approved
permissions:
  contents: read
jobs:
  guard:
    name: ${{ inputs.guard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    env:
      PRACTICE_CI_RUNNER: ${{ github.workspace }}/_practice_ci/tooling/run_practice_ci.py
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The include point for the called workflow's own tooling: it must come after the checkout above,
      # which cleans the workspace. Checks wire their commands to the tooling it provides.
      - name: The called workflow must say which tooling it is
        shell: bash
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          [ -n "$WORKFLOW_REPOSITORY" ] || { echo "::error::job.workflow_repository is empty; the tooling of this workflow cannot be fetched"; exit 1; }
          [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::job.workflow_sha is not a 40-hex commit: '$WORKFLOW_SHA'"; exit 1; }
      - name: Check out the tooling at the commit this workflow runs from
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: _practice_ci
          persist-credentials: false
      - name: The tooling is at exactly that commit
        shell: bash
        env:
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          actual="$(git -C "$GITHUB_WORKSPACE/_practice_ci" rev-parse HEAD)"
          [ "$actual" = "$WORKFLOW_SHA" ] || { echo "::error::the tooling is at $actual, not at $WORKFLOW_SHA"; exit 1; }
      - name: Check out the caller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: caller
          fetch-depth: 0
          persist-credentials: false
      - name: The change to check
        id: range
        shell: bash
        env:
          GUARD: ${{ inputs.guard }}
          GUARDS: '["denylist","removed-paths","release-note","schema-loosening","size"]'
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          jq -en --arg g "$GUARD" --argjson all "$GUARDS" 'any($all[]; . == $g)' > /dev/null \
            || { echo "::error::unknown guard $GUARD; known: $GUARDS"; exit 1; }
          base=""; head=""
          case "$EVENT" in
            pull_request|pull_request_target|pull_request_review) base="$PR_BASE"; head="$PR_HEAD" ;;
            push) if [ -n "$PUSH_BEFORE" ] && ! [[ "$PUSH_BEFORE" =~ ^0+$ ]]; then base="$PUSH_BEFORE"; head="$PUSH_AFTER"; fi ;;
          esac
          if [ -z "$base" ]; then echo "none=true" >> "$GITHUB_OUTPUT"; echo "No change to compare on $EVENT."; exit 0; fi
          # The change is what head adds to the point where it left base.
          mb="$(git merge-base "$base" "$head")"
          { echo "none=false"; echo "base=$base"; echo "mb=$mb"; echo "head=$head"; } >> "$GITHUB_OUTPUT"

      - name: denylist
        if: inputs.guard == 'denylist'
        shell: bash
        env:
          NONE: ${{ steps.range.outputs.none }}
          BASE: ${{ steps.range.outputs.base }}
          MB: ${{ steps.range.outputs.mb }}
          HEAD: ${{ steps.range.outputs.head }}
          LIST: ${{ inputs.denylist }}
          EVENT: ${{ github.event_name }}
          LABEL: ${{ inputs.label }}
          TOOLING: ${{ github.workspace }}/_practice_ci/tooling
          NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # main: prints "ok ...", "found <n> <where>...", "unguarded ..." or "invalid ..."; the term itself is
          # never printed. The scan is tooling/practice_ci/guards/denylist.py, which reads git as bytes (names,
          # quoted paths and commit messages with a NUL are exact) and judges typed records.
          # Inputs: DENY (JSON, see the module), EVENT, TEXT_FILE (rows "<where><TAB><text>") or MB and HEAD.
          # TODO: call scripts/practice-ci denylist once the core track adds the launcher.
          main() {
            python3 -I "${PRACTICE_CI_RUNNER:-tooling/run_practice_ci.py}" denylist
          }
          if [ "$NONE" = true ]; then
            # Nothing to compare, but a repository whose list is missing, empty or unreadable is still
            # unguarded: main checks the list against no text at all.
            echo "Nothing to compare; checking $LIST only."
            DENY=""
            if git cat-file -e "HEAD:$LIST" 2>/dev/null; then DENY="$(git cat-file blob "HEAD:$LIST")"; fi
            TEXT_FILE=/dev/null
            export DENY TEXT_FILE
            result="$(main)"
            echo "$result"
            [ "${result%% *}" = ok ]
            exit
          fi
          # The list comes from the base commit, so a change cannot edit the list it is checked against.
          # Only when the base has none and the change adds it is the change's own list used, without
          # its exemptions: an exemption never applies to the change that adds it.
          DENY=""; BASE_LIST=""; HEAD_LIST=""
          if git cat-file -e "$BASE:$LIST" 2>/dev/null; then BASE_LIST="$(git cat-file blob "$BASE:$LIST")"; fi
          if git cat-file -e "$HEAD:$LIST" 2>/dev/null; then HEAD_LIST="$(git cat-file blob "$HEAD:$LIST")"; fi
          if [ -n "$BASE_LIST" ]; then
            DENY="$BASE_LIST"
          elif [ -n "$HEAD_LIST" ]; then
            echo "$LIST is new in this change; it is checked with that list, without its exemptions."
            DENY="$(jq -c 'if type == "object" then del(.exemptPaths) else . end' <<<"$HEAD_LIST" 2>/dev/null)" \
              || { echo "::error file=$LIST::$LIST is not JSON"; exit 1; }
          fi
          unset TEXT_FILE
          export DENY MB HEAD EVENT
          result="$(main)"
          echo "$result"
          [ "${result%% *}" = ok ]
          # The list the change leaves behind is the one the next change is judged with, so it must be
          # usable and not empty: an entry that is not a digest would match nothing.
          if [ -n "$HEAD_LIST" ] && [ "$HEAD_LIST" != "$BASE_LIST" ]; then
            next="$(DENY="$HEAD_LIST" TEXT_FILE=/dev/null main)"
            [ "${next%% *}" = ok ] || { echo "::error file=$LIST::the list this change writes cannot be used: $next"; exit 1; }
          elif [ -z "$HEAD_LIST" ]; then
            # Deleting the list leaves the next change unguarded. Judged against the merge base, so a list
            # the base gained after the change branched is not counted as deleted by it.
            MB_HAD=""
            if git cat-file -e "$MB:$LIST" 2>/dev/null; then MB_HAD="$(git cat-file blob "$MB:$LIST")"; fi
            [ -z "$MB_HAD" ] || { echo "::error file=$LIST::this change deletes $LIST, so the next change would be unguarded"; exit 1; }
          fi
          # An exemption the change adds or widens is a loosening of the list, judged like a loosened schema.
          # main: judges whether a change adds or widens a denylist exemption. BASE_LIST is the denylist file on
          # the base as it is now (what the merge lands on) and HEAD_LIST the one on the head; either is empty when that commit has none. Prints
          # "ok ..." when every exemptPaths entry of the head list is also, exactly, an entry of the base list (an
          # entry removed is fine), "widened [<glob>, ...]" naming each head entry that is new or changed, or
          # "invalid ..." when a list that is there cannot be read. Widening is a loosening: it needs the approval
          # label, and it never applies to the change that makes it, since the scan reads the base list.
          main() {
            local out
            if ! out="$(jq -cn --arg b "${BASE_LIST:-}" --arg h "${HEAD_LIST:-}" '
                def entries($s): if $s == "" then [] else ($s | fromjson | .exemptPaths // [])
                  | if type == "array" then . else error("exemptPaths is not a list") end end;
                entries($b) as $old
                | [entries($h)[] | . as $e | select(($old | index([$e])) == null)
                   | if type == "object" then (.glob // "(no glob)" | tostring) else tojson end]' 2>/dev/null)"; then
              echo "invalid a denylist file is not JSON, or its exemptPaths is not a list"; return 0
            fi
            if [ "$out" = "[]" ]; then echo "ok no exemption added or widened"; else echo "widened $out"; fi
          }
          # Widening is judged against the base as it is now, since that is what the merge lands on: an entry
          # the base dropped after the change branched would come back with it.
          export BASE_LIST HEAD_LIST
          widened="$(main)"
          echo "$widened"
          case "$widened" in
            ok*) exit 0 ;;
            widened*) ;;
            *) echo "::error file=$LIST::$widened"; exit 1 ;;
          esac
          if [ -z "$NUMBER" ]; then echo "ok not a pull request; the exemption is judged on the pull request"; exit 0; fi
          unset -f main
          # main: prints one line, "ok approved by <login> at <head>", "missing ..." (no review approves the head) or
          # "refused ..." (an approval that does not count, a moved head, or an unreadable answer). The verdict is
          # an APPROVED review at the pull request's exact head by a maintainer or admin who is neither the author
          # nor a bot (tooling/practice_ci/approvals.py); a label is only a trigger to run again, never the proof.
          #   TOOLING  directory holding the practice_ci package
          #   REPO     owner/name
          #   NUMBER   the pull request number
          #   KIND     what is being approved (one of approvals.kinds)
          #   HEAD     the head this run judges; a pull request that has moved on is refused
          #   GH_TOKEN token that can read pull requests
          main() {
            # TOOLING is the trusted checkout, never the PR working directory. Isolated mode
            # ignores PYTHONPATH and user site/startup hooks; add only the trusted package root.
            (cd -- "$TOOLING" && python3 -I -c 'import os, runpy, sys; sys.path.insert(0, os.getcwd()); runpy.run_module("practice_ci.approvals", run_name="__main__")' --repo "$REPO" --pr "$NUMBER" --kind "$KIND" --head "$HEAD") || true
          }
          export KIND='schema-loosening'
          verdict="$(main)"
          case "$verdict" in
            ok*) echo "ok exemption accepted: ${verdict#ok }" ;;
            missing*)
              MB_LIST=""
              if git cat-file -e "$MB:$LIST" 2>/dev/null; then MB_LIST="$(git cat-file blob "$MB:$LIST")"; fi
              if [ "$MB_LIST" != "$BASE_LIST" ]; then
                echo "$LIST changed on the base after this change branched; if the change does not mean to add an exemption, merge the base in."
              fi
              echo "::error file=$LIST::a denylist exemption is added or widened; a maintainer reviews it and approves this exact head (${verdict#missing }); the label $LABEL only re-runs the check"; exit 1 ;;
            *) echo "::error::${verdict#refused }"; exit 1 ;;
          esac

      - name: removed-paths
        if: inputs.guard == 'removed-paths' && steps.range.outputs.none == 'false'
        shell: bash
        env:
          MB: ${{ steps.range.outputs.mb }}
          HEAD: ${{ steps.range.outputs.head }}
          HISTORY: ${{ inputs.history }}
        run: |
          set -euo pipefail
          # main: prints "ok ..." or "referenced [{path, at}, ...]" or "invalid ...". The guard is
          # tooling/practice_ci/guards/removed_paths.py (inputs in its docstring): the removed paths (both paths of a
          # rename, exact) are read from git for MB..HEAD when DELETED is unset.
          # TODO: call scripts/practice-ci removed-paths once the core track adds the launcher.
          main() {
            python3 -I "${PRACTICE_CI_RUNNER:-tooling/run_practice_ci.py}" removed-paths
          }
          ROOT="$GITHUB_WORKSPACE"
          export ROOT HISTORY
          result="$(main)"
          echo "$result"
          [ "${result%% *}" = ok ]

      - name: release-note
        if: inputs.guard == 'release-note' && steps.range.outputs.none == 'false'
        shell: bash
        env:
          MB: ${{ steps.range.outputs.mb }}
          HEAD: ${{ steps.range.outputs.head }}
          WATCH: ${{ inputs.watch }}
          CHANGELOG: ${{ inputs.changelog }}
          MARKER: 'Release: none'
        run: |
          set -euo pipefail
          # main: prints "ok ...", "missing ..." or "invalid ...". The guard is
          # tooling/practice_ci/guards/release_note.py (inputs in its docstring): the changed paths (both paths of
          # a rename, exact) and the commit messages (every byte) are read from git for MB..HEAD when CHANGED and
          # MESSAGES are unset.
          # TODO: call scripts/practice-ci release-note once the core track adds the launcher.
          main() {
            python3 -I "${PRACTICE_CI_RUNNER:-tooling/run_practice_ci.py}" release-note
          }
          export WATCH CHANGELOG MARKER MB HEAD
          result="$(main)"
          echo "$result"
          [ "${result%% *}" = ok ]

      - name: schema-loosening
        if: inputs.guard == 'schema-loosening' && steps.range.outputs.none == 'false'
        shell: bash
        env:
          MB: ${{ steps.range.outputs.mb }}
          HEAD: ${{ steps.range.outputs.head }}
          # Reviewed pattern changes that only tighten, shipped with this workflow at its pin.
          TIGHTEN: '[{"sha256":"7663e1bec8c96806db4767e51a62f6277cb32c33f31ef220b58e1e38c368fc2e","why":"v2.1.0 node measuredAt: any YYYY-MM-DD becomes a real calendar date"},{"sha256":"b3f86a4733165b4c53c2522ac953dc11eddb93189459f76af87f876f23d52983","why":"v2.1.0 node attrs.fetched_at: any text ending in Z becomes a real UTC date-time ending in Z"},{"sha256":"ac72432b0442a01bda943d78218bfb26c30cbb525aa82869035e4d4fa0b9bf4d","why":"v2.1.0 refresh-report and sources defs.time (moved from practice-library/graphs): the same time of day, on a real calendar date"}]'
          LABEL: ${{ inputs.label }}
          TOOLING: ${{ github.workspace }}/_practice_ci/tooling
          NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # main: judges one changed JSON file. OLD_FILE is the file on the base commit; NEW_FILE the file on the
          # head, or empty when the change deleted it. Prints "invalid ..." when OLD_FILE cannot be read, "skip ..."
          # when it is not a JSON schema (its top-level $schema does not name a json-schema.org meta-schema, as an
          # instance pointing at its own schema does not), loose ["(deleted)"] when a schema was deleted, and
          # otherwise what compare prints.
          main() {
            [ -r "${OLD_FILE:-}" ] || { echo "invalid cannot read the base file"; return 0; }
            if ! jq -e 'type == "object" and ((.["$schema"] // "") | type == "string" and test("^https?://json-schema\\.org/"))' "$OLD_FILE" > /dev/null 2>&1; then
              echo "skip not a JSON schema"; return 0
            fi
            if [ -z "${NEW_FILE:-}" ]; then echo 'loose ["(deleted)"]'; return 0; fi
            compare
          }

          # compare: prints "ok ..." when the schema in NEW_FILE accepts nothing more than the one in OLD_FILE by
          # the rules below, otherwise "loose [<path>, ...]". Rules, at every place in the schema:
          #   a minimum (minItems, minLength, minProperties, minimum, exclusiveMinimum, minContains) lowered or removed;
          #   a maximum (maxItems, maxLength, maxProperties, maximum, exclusiveMaximum, maxContains) raised or removed;
          #   a required entry removed; an enum value added; additionalProperties or unevaluatedProperties false
          #   made anything else; a key added under properties or patternProperties beside an additionalProperties
          #   or unevaluatedProperties that was false (the new key accepts what the false refused, as below);
          #   const, pattern or format changed or removed; and, since a change the guard cannot show safe needs the
          #   label: a type set that gains a type or loses its type, any change under not, if, oneOf or contains
          #   (they do not count the normal way); beside an additionalProperties, items, additionalItems,
          #   unevaluatedProperties or unevaluatedItems that is not true, a properties or patternProperties key,
          #   prefixItems or list items added, and beside an unevaluated one an additionalProperties, items,
          #   additionalItems or contains added or an allOf, anyOf, oneOf, if, then, else, dependentSchemas or
          #   dependencies changed (a key whose schema is the old additionalProperties is not counted); a
          #   minContains below 1 added beside contains; a changed $defs or definitions in a file with a reference
          #   and an unevaluated keyword that is not true; a $ref, $dynamicRef or $recursiveRef added,
          #   removed or changed; an allOf, anyOf, prefixItems or list items that changes length; any constraint
          #   keyword removed; a subschema made true, a false one opened, or one replaced by another shape (a list
          #   items for a schema items); a $schema, $id, $anchor, $dynamicAnchor or $vocabulary added, removed or
          #   changed (they move what a reference reaches or which keywords count); and any other keyword changed
          #   (multipleOf, uniqueItems, ...). In a file with a reference under not, if, oneOf or contains, any
          #   constraint change at any place is loose, a tightening included: the reference may reach it there.
          #   Annotations (title, description, default, examples, $comment, ...) are not judged; a $defs entry is
          #   judged like any other place, but adding or removing a whole entry is not.
          # A pattern changed to another string is not loose when the pair is listed in TIGHTEN (unset means no
          # list): a JSON array of {"sha256": <64 lower-case hex>, "why": <text>}, each the SHA-256 of the pair
          # written as compact JSON, ["<old pattern>","<new pattern>"], with no newline. A list entry is a reviewed
          # claim that the new pattern accepts nothing the old one refused. That makes the schema tighter only where
          # a pattern counts the normal way, so the list is ignored for a pattern under not, if, oneOf or contains,
          # and for the whole file when either schema has a $ref, $dynamicRef or $recursiveRef under one of those
          # (it may point at the pattern). A reference from another file is not seen: the guard judges one file. A malformed list prints "invalid", so
          # nothing passes on a list that cannot be read; a removed pattern, or a pair not listed, stays loose.
          compare() {
            local out list entry path pair hash loose="[]" tightened="[]"
            list="${TIGHTEN-[]}"
            if ! jq -se 'length == 1 and (.[0] | type == "array" and all(.[]; type == "object" and (.sha256 | type == "string" and test("^[0-9a-f]{64}$")) and (.why | type == "string" and length > 0)))' <<<"$list" > /dev/null 2>&1; then
              echo "invalid TIGHTEN must be a JSON array of {sha256, why}"; return 0
            fi
            if ! out="$(jq -cn --slurpfile o "$OLD_FILE" --slurpfile n "$NEW_FILE" '
                $o[0] as $old | $n[0] as $new
                | ["minItems","minLength","minProperties","minimum","exclusiveMinimum","minContains"] as $mins
                | ["maxItems","maxLength","maxProperties","maximum","exclusiveMaximum","maxContains"] as $maxs
                | ["not","if","oneOf","contains"] as $rev
                | ([[$old, $new][] | paths | select((.[-1] | IN("$ref", "$dynamicRef", "$recursiveRef")) and any(.[]; . as $e | $rev | index([$e])))] | length > 0) as $refrev
                | [ $old | paths | select(length > 0 and (.[-1] | type) == "string") ] as $ps
                | [ $ps[] as $p
                    | $p[-1] as $k
                    | ($old | getpath($p)) as $ov
                    | ($new | try getpath($p) catch null) as $nv
                    | select(
                        if ($mins | index([$k])) != null and ($ov | type) == "number" then ($nv | type) != "number" or $nv < $ov
                        elif ($maxs | index([$k])) != null and ($ov | type) == "number" then ($nv | type) != "number" or $nv > $ov
                        elif $k == "required" and ($ov | type) == "array" then
                          ($nv | if type == "array" then . else [] end) as $nr | any($ov[]; . as $x | ($nr | index([$x])) == null)
                        elif $k == "enum" and ($ov | type) == "array" then
                          ($nv | type) != "array" or any($nv[]; . as $x | ($ov | index([$x])) == null)
                        elif ($k == "additionalProperties" or $k == "unevaluatedProperties") and $ov == false then $nv != false
                        elif $k == "const" or (($k == "pattern" or $k == "format") and ($ov | type) == "string") then $nv != $ov
                        else false end)
                    | {path: ($p | map(tostring) | join("/")),
                       pair: (if $k == "pattern" and ($ov | type) == "string" and ($nv | type) == "string"
                                and ($refrev | not) and (any($p[]; . as $e | $rev | index([$e])) | not)
                              then [$ov, $nv] else null end)} ]
                  # What the rules above cannot show safe is loose. A schema place is the root, a keyword holding one
                  # subschema, an entry of a keyword holding a map of them, or an item of one holding a list.
                  + ( ["items","additionalItems","unevaluatedItems","contains","propertyNames","additionalProperties",
                       "unevaluatedProperties","not","if","then","else","contentSchema"] as $sub
                    | ["properties","patternProperties","dependentSchemas","$defs","definitions"] as $submap
                    | ["allOf","anyOf","oneOf","prefixItems","items"] as $subarr
                    | ["title","description","default","examples","$comment","deprecated","readOnly","writeOnly",
                       "contentMediaType","contentEncoding","$defs","definitions"] as $annot
                    # What a reference resolves to or which dialect applies: removed or changed is judged like any
                    # other keyword below; added, it is judged here.
                    | ["$schema","$id","id","$anchor","$dynamicAnchor","$recursiveAnchor","$vocabulary"] as $ident
                    | ["$ref","$dynamicRef","$recursiveRef"] as $refs
                    | ($mins + $maxs + ["required","enum","const","pattern","format","type"]) as $handled
                    | def isschema: length == 0
                        or ((.[-1] | type) == "string" and (.[-1] | IN($sub[])) and (.[:-1] | isschema))
                        or (length >= 2 and (.[-2] | type) == "string" and (.[-2] | IN($submap[])) and (.[-1] | type) == "string" and (.[:-2] | isschema))
                        or (length >= 2 and (.[-2] | type) == "string" and (.[-2] | IN($subarr[])) and (.[-1] | type) == "number" and (.[:-2] | isschema));
                      def at($t; $p): $t | try getpath($p) catch null;
                      # A key that leaves properties or patternProperties ($k) is refused only when nothing else in the
                      # object can still take it: a false additionalProperties with no entry of the other map (a pattern
                      # may match the name), or a false unevaluatedProperties with neither that nor additionalProperties
                      # nor any keyword that evaluates properties (an allOf or a reference may name the key).
                      # unevaluatedProperties is a keyword only from draft 2019-09: under an older $schema it refuses nothing.
                      # Every $schema counts, the roots and those of embedded resources, so both roots must declare one, and
                      # each must be a full dialect: a vocabulary meta-schema (.../meta/applicator) may leave unevaluated out.
                      (([$old, $new] | all(.[]; type == "object" and has("$schema")))
                       and all([$old, $new][] | .. | objects | select(has("$schema")) | .["$schema"];
                               type == "string" and test("^https?://json-schema\\.org/draft/(2019-09|2020-12)/schema#?$"))) as $unevalcounts
                      | def refuses($k):
                        type == "object" and ($k | IN("properties", "patternProperties"))
                        and ((if $k == "properties" then "patternProperties" else "properties" end) as $other | has($other) | not)
                        and (.additionalProperties == false
                             or ($unevalcounts and .unevaluatedProperties == false and (has("additionalProperties") | not)
                                 and (. as $x | any("allOf", "anyOf", "oneOf", "if", "then", "else", "dependentSchemas",
                                                    "dependencies", "$ref", "$dynamicRef", "$recursiveRef"; . as $a | $x | has($a)) | not)));
                      def where($p): if ($p | length) == 0 then "(root)" else $p | map(tostring) | join("/") end;
                      ([[]] + [$old | paths | select(isschema)]) as $places
                    | ([[]] + [$new | paths | select(isschema)]) as $newplaces
                    | [ ( $places[] as $s | at($old; $s) as $o | at($new; $s) as $n
                          | if ($o | type) == "boolean" then
                              # A false subschema opened.
                              (select($o == false and ($s | length) > 0 and $n != false and $n != null) | where($s))
                            elif ($o | type) != "object" then empty
                            elif $n == true then
                              # A subschema with constraints made true.
                              (select(any($o | keys[]; IN($annot[]) | not)) | where($s))
                            elif $n == false or $n == null then empty
                            elif ($n | type) != "object" then
                              # A subschema replaced by another shape (a list items for a schema items) is not compared.
                              where($s)
                            else
                              ( $o | keys[] as $k
                                | select($k | IN($annot[]) | not)
                                | if ($n | has($k)) | not then
                                    # A constraint removed (a removed properties map under an object that refuses its keys refuses more).
                                    select(($k | IN("properties", "patternProperties")) and ($o | refuses($k)) and ($n | refuses($k)) | not)
                                    | where($s + [$k])
                                  elif $k == "type" then
                                    # A type set that gained a type.
                                    ($o.type | if type == "array" then . else [.] end) as $ot
                                    | ($n.type | if type == "array" then . elif type == "string" then [.] else [] end) as $nt
                                    | select(any($nt[]; . as $x | $ot | index([$x]) | not)) | where($s + [$k])
                                  elif $k | IN($handled[]) then
                                    # Judged above only in the type its rule compares; in any other (a draft-04 boolean
                                    # exclusiveMaximum) any change is loose.
                                    (if ($mins + $maxs) | index([$k]) then "number"
                                     elif $k == "required" or $k == "enum" then "array"
                                     elif $k == "const" then ($o[$k] | type)
                                     else "string" end) as $t
                                    | select(($o[$k] | type) != $t and $o[$k] != $n[$k]) | where($s + [$k])
                                  elif $k | IN($refs[]) then empty
                                  elif $k | IN("not", "if", "oneOf", "contains") then
                                    # Not monotonic (contains with maxContains counts matches): any change may accept more.
                                    select($o[$k] != $n[$k]) | where($s + [$k])
                                  elif $k | IN("allOf", "anyOf", "prefixItems") then
                                    # A list of subschemas that changed length cannot be compared item by item.
                                    select(($o[$k] | type) == "array" and (($n[$k] | type) != "array" or ($n[$k] | length) != ($o[$k] | length)))
                                    | where($s + [$k])
                                  elif $k == "items" and ($o[$k] | type) == "array" then
                                    select(($n[$k] | type) != "array" or ($n[$k] | length) != ($o[$k] | length)) | where($s + [$k])
                                  elif $k | IN("properties", "patternProperties", "dependentSchemas") then
                                    # An entry removed, unless the object refuses the key both before and after (never for
                                    # a dependentSchemas entry, which only ever adds rules).
                                    ($n[$k] | if type == "object" then keys else [] end) as $nk
                                    | ($o[$k] | if type == "object" then keys[] else empty end)
                                    | select(. as $x | $nk | index([$x]) | not)
                                    | select((($o | refuses($k)) and ($n | refuses($k))) | not)
                                    | where($s + [$k, .])
                                  elif $k | IN($sub[]) or IN($submap[]) or IN($subarr[]) then empty
                                  else
                                    # Any other keyword changed (multipleOf, uniqueItems, dependentRequired, ...).
                                    select($o[$k] != $n[$k]) | where($s + [$k])
                                  end )
                            end ),
                        # Beside a keyword that judges what the others leave (additionalProperties, items, additionalItems,
                        # unevaluatedProperties, unevaluatedItems, unless it is true), a keyword that takes more properties
                        # or items for itself moves them out from under it: what it refused may now pass.
                        ( $places[] as $s | at($old; $s) as $o | at($new; $s) as $n
                          | select(($o | type) == "object" and ($n | type) == "object")
                          | def judges($k): $o | has($k) and .[$k] != true;
                            def keysof($v): $v | if type == "object" then keys else [] end;
                            def len($v): $v | if type == "array" then length else -1 end;
                            def added($k): ($o | has($k) | not) and ($n | has($k));
                            ( select(judges("additionalProperties") or judges("unevaluatedProperties"))
                              | ["properties", "patternProperties"][] as $k
                              | keysof($o[$k]) as $ok | keysof($n[$k])[] | select(. as $x | $ok | index([$x]) | not)
                              # A key whose schema is the old additionalProperties accepts what it did before.
                              | select(judges("unevaluatedProperties") or $n[$k][.] != $o.additionalProperties)
                              | where($s + [$k, .]) ),
                            ( select(judges("items") or judges("unevaluatedItems"))
                              | select(len($n.prefixItems) > len($o.prefixItems)) | where($s + ["prefixItems"]) ),
                            ( select(judges("additionalItems") or judges("unevaluatedItems"))
                              | select(($n.items | type) == "array" and len($n.items) > len($o.items)) | where($s + ["items"]) ),
                            ( select(judges("unevaluatedProperties")) | select(added("additionalProperties")) | where($s + ["additionalProperties"]) ),
                            ( select(judges("unevaluatedItems")) | ["items", "additionalItems", "contains"][] as $k
                              | select(added($k)) | where($s + [$k]) ),
                            ( select(judges("unevaluatedProperties") or judges("unevaluatedItems"))
                              | ["allOf", "anyOf", "oneOf", "if", "then", "else", "dependentSchemas", "dependencies"][] as $k
                              | select($o[$k] != $n[$k]) | where($s + [$k]) ),
                            # minContains defaults to 1 beside contains: one added below that accepts an array with no match.
                            ( select(($o | has("contains")) and added("minContains") and ($n.minContains | type) == "number" and $n.minContains < 1)
                              | where($s + ["minContains"]) ) ),
                        # A definition a reference reaches can evaluate properties or items for an unevaluated keyword the
                        # guard cannot tie it to, so in a file with both a changed $defs or definitions is loose.
                        ( select(any($old | .. | objects; (has("unevaluatedProperties") and .unevaluatedProperties != true)
                                                           or (has("unevaluatedItems") and .unevaluatedItems != true)))
                          | select(any($old, $new | paths; .[-1] | IN($refs[])))
                          | ["$defs", "definitions"][] as $k | select(at($old; [$k]) != at($new; [$k])) | where([$k]) ),
                        # A $schema, $id, $anchor, $dynamicAnchor or $vocabulary added: it can move what a reference reaches
                        # or which keywords count.
                        # A new place counts too: a $defs entry added with an $id can capture an existing reference.
                        ( ($places + $newplaces | unique)[] as $s | at($old; $s) as $o | at($new; $s) as $n
                          | select(($n | type) == "object")
                          | $ident[] as $k | select(($o | type == "object" and has($k)) | not) | select($n | has($k)) | where($s + [$k]) ),
                        # With a reference under not, if, oneOf or contains, any place may be reached there, where a
                        # tighter rule accepts more: every constraint change is loose, tightenings too.
                        ( select($refrev)
                          | $places[] as $s | at($old; $s) as $o | at($new; $s) as $n
                          | if ($o | type) != "object" or ($n | type) != "object" then
                              select($o != $n and $n != null) | where($s)
                            else
                              def shape: if type == "object" then keys elif type == "array" then length else . end;
                              ($o + $n | keys[]) as $k
                              | select($k | IN($annot[]) | not)
                              | select(
                                  if $k | IN($sub[]) then ($o | has($k)) != ($n | has($k))
                                  elif $k | IN($submap[]) or IN($subarr[]) then ($o[$k] | shape) != ($n[$k] | shape)
                                  else $o[$k] != $n[$k] end)
                              | where($s + [$k])
                            end ),
                        # A reference added, removed or changed: the guard cannot follow it.
                        ( ($places + $newplaces | unique)[] as $s
                          | $refs[] as $r
                          | (at($old; $s) | if type == "object" then .[$r] else null end) as $or
                          | (at($new; $s) | if type == "object" then .[$r] else null end) as $nr
                          | select($or != $nr) | where($s + [$r]) ) ]
                    | map({path: ., pair: null}) )
                  | reduce .[] as $e ([]; if any(.[]; .path == $e.path) then . else . + [$e] end)' 2>/dev/null)"; then
              echo "invalid both files must be JSON"; return 0
            fi
            while IFS= read -r entry; do
              path="$(jq -r '.path' <<<"$entry")"
              pair="$(jq -cj '.pair' <<<"$entry")"
              if [ "$pair" != null ]; then
                hash="$(printf '%s' "$pair" | sha256sum | cut -d' ' -f1)"
                if jq -e --arg h "$hash" 'any(.[]; .sha256 == $h)' <<<"$list" > /dev/null; then
                  tightened="$(jq -c --arg p "$path" '. + [$p]' <<<"$tightened")"; continue
                fi
              fi
              loose="$(jq -c --arg p "$path" '. + [$p]' <<<"$loose")"
            done < <(jq -c '.[]' <<<"$out")
            if [ "$loose" != "[]" ]; then echo "loose $loose"
            elif [ "$tightened" != "[]" ]; then echo "ok nothing loosened; listed tightenings $tightened"
            else echo "ok nothing loosened"; fi
          }
          loose="[]"
          while IFS=$'\t' read -r status old new; do
            new="${new:-$old}"
            OLD_FILE="$RUNNER_TEMP/old.json"; NEW_FILE="$RUNNER_TEMP/new.json"
            git cat-file blob "$MB:$old" > "$OLD_FILE" || { echo "::error file=$old::cannot read $old on the base"; exit 1; }
            # A deleted schema accepts everything it used to refuse, so it counts as loosened.
            if [ "$status" = D ]; then NEW_FILE=""
            else git cat-file blob "$HEAD:$new" > "$NEW_FILE" || { echo "::error file=$new::cannot read $new on the head"; exit 1; }; fi
            export OLD_FILE NEW_FILE
            result="$(main)"
            echo "$new: $result"
            case "$result" in
              ok*|skip*) ;;
              loose*) loose="$(jq -c --arg f "$new" --argjson p "${result#loose }" '. + [$p[] | $f + "#/" + .]' <<<"$loose")" ;;
              *) echo "::error file=$new::$result"; exit 1 ;;
            esac
          done < <(git diff --name-status -M --diff-filter=MRD --no-ext-diff "$MB" "$HEAD" -- '*.json' | sed -E 's/^R[0-9]*/R/')
          if [ "$loose" = "[]" ]; then echo "ok no schema loosened"; exit 0; fi
          echo "loosened: $loose"
          if [ -z "$NUMBER" ]; then echo "ok not a pull request; loosening is judged on the pull request"; exit 0; fi
          unset -f main
          # main: prints one line, "ok approved by <login> at <head>", "missing ..." (no review approves the head) or
          # "refused ..." (an approval that does not count, a moved head, or an unreadable answer). The verdict is
          # an APPROVED review at the pull request's exact head by a maintainer or admin who is neither the author
          # nor a bot (tooling/practice_ci/approvals.py); a label is only a trigger to run again, never the proof.
          #   TOOLING  directory holding the practice_ci package
          #   REPO     owner/name
          #   NUMBER   the pull request number
          #   KIND     what is being approved (one of approvals.kinds)
          #   HEAD     the head this run judges; a pull request that has moved on is refused
          #   GH_TOKEN token that can read pull requests
          main() {
            # TOOLING is the trusted checkout, never the PR working directory. Isolated mode
            # ignores PYTHONPATH and user site/startup hooks; add only the trusted package root.
            (cd -- "$TOOLING" && python3 -I -c 'import os, runpy, sys; sys.path.insert(0, os.getcwd()); runpy.run_module("practice_ci.approvals", run_name="__main__")' --repo "$REPO" --pr "$NUMBER" --kind "$KIND" --head "$HEAD") || true
          }
          export KIND='schema-loosening'
          verdict="$(main)"
          case "$verdict" in
            ok*) echo "ok loosening accepted: ${verdict#ok }" ;;
            missing*) echo "::error::a schema is loosened; a maintainer reviews it and approves this exact head (${verdict#missing }); the label $LABEL only re-runs the check"; exit 1 ;;
            *) echo "::error::${verdict#refused }"; exit 1 ;;
          esac

      - name: size
        if: inputs.guard == 'size' && steps.range.outputs.none == 'false'
        shell: bash
        env:
          MB: ${{ steps.range.outputs.mb }}
          HEAD: ${{ steps.range.outputs.head }}
          LIMIT: ${{ inputs.size-limit }}
          FIXTURES: ${{ inputs.size-fixtures }}
          LABEL: ${{ inputs.size-label }}
          TOOLING: ${{ github.workspace }}/_practice_ci/tooling
          NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # main: prints "ok <n> non-fixture lines (limit <L>)", "over <n> non-fixture lines, more than <L>: split the
          # pull request" or "invalid ...". The guard is tooling/practice_ci/guards/size.py (inputs in its
          # docstring): when NUMSTAT is unset the counts are read from git for MB..HEAD with exact paths.
          # TODO: call scripts/practice-ci size once the core track adds the launcher.
          main() {
            python3 -I "${PRACTICE_CI_RUNNER:-tooling/run_practice_ci.py}" size
          }
          export LIMIT FIXTURES MB HEAD
          result="$(main)"
          echo "$result"
          case "$result" in
            ok*) exit 0 ;;
            over*) ;;
            *) echo "::error::$result"; exit 1 ;;
          esac
          if [ -z "$NUMBER" ]; then echo "ok not a pull request; size is judged on the pull request"; exit 0; fi
          unset -f main
          # main: prints one line, "ok approved by <login> at <head>", "missing ..." (no review approves the head) or
          # "refused ..." (an approval that does not count, a moved head, or an unreadable answer). The verdict is
          # an APPROVED review at the pull request's exact head by a maintainer or admin who is neither the author
          # nor a bot (tooling/practice_ci/approvals.py); a label is only a trigger to run again, never the proof.
          #   TOOLING  directory holding the practice_ci package
          #   REPO     owner/name
          #   NUMBER   the pull request number
          #   KIND     what is being approved (one of approvals.kinds)
          #   HEAD     the head this run judges; a pull request that has moved on is refused
          #   GH_TOKEN token that can read pull requests
          main() {
            # TOOLING is the trusted checkout, never the PR working directory. Isolated mode
            # ignores PYTHONPATH and user site/startup hooks; add only the trusted package root.
            (cd -- "$TOOLING" && python3 -I -c 'import os, runpy, sys; sys.path.insert(0, os.getcwd()); runpy.run_module("practice_ci.approvals", run_name="__main__")' --repo "$REPO" --pr "$NUMBER" --kind "$KIND" --head "$HEAD") || true
          }
          export KIND='size'
          verdict="$(main)"
          case "$verdict" in
            ok*) echo "ok larger pull request accepted: ${verdict#ok }" ;;
            missing*) echo "::error::${result#over }; or a maintainer approves this exact head (${verdict#missing }); the label $LABEL only re-runs the check"; exit 1 ;;
            *) echo "::error::${verdict#refused }"; exit 1 ;;
          esac
