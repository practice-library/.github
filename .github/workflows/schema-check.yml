# Generated from templates/.github/workflows/schema-check.yml and policy/constants.json by scripts/render.sh. Do not edit.
name: schema-check
on:
  workflow_call:
    inputs:
      schema:
        description: JSON Schema (2020-12) path in the calling repository, or in the fixture when fixture is set.
        type: string
        required: true
      instances:
        description: A JSON file or a directory of JSON files to validate against the schema.
        type: string
        required: true
      _selftest-fixture:
        description: Self-test only. A fixture directory under selftest/fixtures that schema and instances are relative to.
        type: string
        default: ''
      expect:
        description: pass (default) or fail. Use fail for a counter-example that must not validate; the check then passes only when validation fails with the validator's finding exit code.
        type: string
        default: pass
      each:
        description: true to validate every JSON file under instances on its own; expect then has to hold for each file, so a folder of counter-examples passes only when every one of them is rejected.
        type: string
        default: 'false'
permissions:
  contents: read
jobs:
  validate:
    name: schema-check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch jsonschema 17.2.1, pinned by sha256
        shell: bash
        env:
          TOOL_URL: https://github.com/sourcemeta/jsonschema/releases/download/v17.2.1/jsonschema-17.2.1-linux-x86_64.zip
          TOOL_SHA256: 9ffee3cfbe0fe1343d9d36bcce9e6036ec4d73e4b29f656c039fca6118da2f35
          TOOL_ARCHIVE: zip
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/tools/jsonschema"
          mkdir -p "$dir"
          curl -fsSL --retry 3 "$TOOL_URL" -o "$dir/archive"
          echo "$TOOL_SHA256  $dir/archive" | sha256sum -c -
          case "$TOOL_ARCHIVE" in
            tar.gz) tar -xzf "$dir/archive" -C "$dir" ;;
            zip) unzip -q "$dir/archive" -d "$dir" ;;
            *) echo "::error::unknown archive type $TOOL_ARCHIVE"; exit 1 ;;
          esac
      - name: Validate
        id: run
        shell: bash
        env:
          JSONSCHEMA: ${{ runner.temp }}/tools/jsonschema/jsonschema-17.2.1-linux-x86_64/bin/jsonschema
          SCHEMA: ${{ inputs.schema }}
          INSTANCES: ${{ inputs.instances }}
          FIXTURE: ${{ inputs._selftest-fixture }}
          FIXTURES_DIR: selftest/fixtures
          FINDING_RC: 2
          EACH: ${{ inputs.each }}
          NODE_SPEC: '{"$schema":"https://json-schema.org/draft/2020-12/schema","$id":"https://github.com/practice-library/.github/spec/node/schema.json","title":"Fact node","description":"The envelope every fact node shares: id, type, name, source URL, measuredAt, attrs (verdict, fetched_at, quote, and an optional basis) and edges. A domain schema references this one and declares only its type values. That every edge target exists is checked by the graph checker, not by this schema.","type":"object","required":["id","type","name","source","measuredAt","attrs","edges"],"additionalProperties":false,"properties":{"id":{"type":"string","pattern":"^[a-z][a-z0-9-]*(\\.[a-z0-9][a-z0-9-]*)+$"},"type":{"type":"string","pattern":"^[a-z][a-z0-9-]*$","description":"One of the type values the domain schema declares."},"name":{"type":"string","minLength":1,"maxLength":120},"source":{"$ref":"#/$defs/url","description":"Where the fact was read: the official page for a documented fact, or the run or record that measured it for an observed one. The quote is on this page or in this record."},"measuredAt":{"type":"string","format":"date","pattern":"^\\d{4}-\\d{2}-\\d{2}$"},"attrs":{"type":"object","required":["verdict","fetched_at","quote"],"additionalProperties":false,"properties":{"verdict":{"enum":["allowed","denied","limited","unknown"]},"fetched_at":{"type":"string","format":"date-time","pattern":"Z$","description":"When the page was read, or for an observed fact when the measurement ran."},"quote":{"type":"string","minLength":1,"maxLength":500,"description":"A short sentence copied exactly from the page, or for an observed fact a line copied exactly from the run log or record."},"basis":{"enum":["documented","observed"],"description":"Where the number comes from: documented (the vendor states it) or observed (our own measurement). Absent means documented. A documented node and an observed node about the same quantity stay two nodes, linked by an observes edge from the observed one."},"value":{"type":"number","description":"A number only; its meaning is carried by unit, scope and window."},"unit":{"type":"string","minLength":1},"scope":{"type":"string","minLength":1},"window":{"type":"string","minLength":1},"note":{"type":"string","minLength":1,"maxLength":300,"description":"Prose that does not fit value, unit, scope or window."}},"if":{"properties":{"verdict":{"const":"limited"}},"required":["verdict"]},"then":{"required":["scope"]}},"edges":{"type":"array","items":{"type":"object","required":["rel","to"],"additionalProperties":false,"properties":{"rel":{"enum":["availableOn","requires","grantedBy","limits","appliesTo","prohibitedBy","supersedes","hasRelease","introducedIn","removedIn","observes"]},"to":{"type":"string","pattern":"^[a-z][a-z0-9-]*(\\.[a-z0-9][a-z0-9-]*)+$"}}}}},"$defs":{"url":{"type":"string","format":"uri","pattern":"^https://"}}}'
        run: |
          set -uo pipefail
          # The default bash shell runs with -e; capture the exit code instead of letting it end the step.
          # main: combines per-file exit codes into one. RCS is a space-separated list, FINDING the validator's
          # finding exit code. Prints "pass 0" when every file passed, "finding <FINDING>" when every file was
          # rejected with a finding, and "mixed 1" otherwise (mixed results, another error, or no files), so an
          # expectation of pass or fail holds only when it holds for each file. The last word is the exit code.
          main() {
            local rc all_pass=true all_finding=true n=0
            for rc in $RCS; do
              n=$((n + 1))
              [ "$rc" = 0 ] || all_pass=false
              [ "$rc" = "$FINDING" ] || all_finding=false
            done
            if [ "$n" -eq 0 ]; then echo "mixed 1"; return 0; fi
            if [ "$all_pass" = true ]; then echo "pass 0"; elif [ "$all_finding" = true ]; then echo "finding $FINDING"; else echo "mixed 1"; fi
          }
          base="$GITHUB_WORKSPACE"
          if [ -n "$FIXTURE" ]; then base="$GITHUB_WORKSPACE/$FIXTURES_DIR/$FIXTURE"; fi
          # The shared fact-node envelope (https://github.com/practice-library/.github/spec/node/schema.json) is always resolvable, so a domain
          # schema can reference it without keeping a copy.
          printf '%s' "$NODE_SPEC" > "$RUNNER_TEMP/node-spec.json"
          resolve=(--resolve "$RUNNER_TEMP/node-spec.json")
          if [ "$EACH" = true ]; then
            RCS=""
            while IFS= read -r -d '' file; do
              one=0
              "$JSONSCHEMA" validate "${resolve[@]}" "$base/$SCHEMA" "$file" > /dev/null 2>&1 || one=$?
              echo "exit $one: ${file#"$base"/}"
              RCS="$RCS $one"
            done < <(find "$base/$INSTANCES" -type f -name '*.json' -print0 | sort -z)
            FINDING="$FINDING_RC"
            result="$(main)"
            echo "$result"
            rc="${result##* }"
          else
            rc=0
            "$JSONSCHEMA" validate "${resolve[@]}" "$base/$SCHEMA" "$base/$INSTANCES" || rc=$?
          fi
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          [ "$rc" -eq 0 ] || [ "$rc" -eq "$FINDING_RC" ]
      - name: Compare the result with the expectation
        shell: bash
        env:
          EXPECT: ${{ inputs.expect }}
          RC: ${{ steps.run.outputs.rc }}
          FINDING_RC: 2
        run: |
          set -euo pipefail
          case "${EXPECT:-pass}" in
            pass) [ "$RC" = 0 ] || { echo "::error::jsonschema reported findings (exit $RC)"; exit 1; } ;;
            fail) [ "$RC" = "$FINDING_RC" ] || { echo "::error::expected jsonschema to report a finding (exit $FINDING_RC), got exit $RC"; exit 1; } ;;
            *) echo "::error::expect must be pass or fail, got $EXPECT"; exit 1 ;;
          esac
