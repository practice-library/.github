# Generated from templates/.github/workflows/schema-check.yml and policy/constants.json by scripts/render.sh. Do not edit.
name: schema-check
on:
  workflow_call:
    inputs:
      schema:
        description: JSON Schema (2020-12) path in the calling repository, or in the fixture when fixture is set.
        type: string
        required: true
      instances:
        description: validate mode. A JSON file or a directory of JSON files to validate against the schema.
        type: string
        default: ''
      _selftest-fixture:
        description: Self-test only. A fixture directory under selftest/fixtures that schema and instances are relative to.
        type: string
        default: ''
      expect:
        description: pass (default) or fail. Use fail for a counter-example that must not validate; the check then passes only when validation fails with the validator's finding exit code. A setup error, such as a wrong resolve-ids pin, fails the check whatever expect says; only a self-test fixture may set error to expect one.
        type: string
        default: pass
      each:
        description: true to validate every JSON file under instances on its own; expect then has to hold for each file, so a folder of counter-examples passes only when every one of them is rejected.
        type: string
        default: 'false'
      mode:
        description: validate (default) checks instances against schema; metaschema checks schema (a file, or every *.json under a directory) against its own $schema; guards applies each mutant in the guards file to schema and passes only when every mutant turns an example or a counter-example red.
        type: string
        default: validate
      resolve:
        description: Extra schemas the validator may resolve by $id, one path per line, besides the shared node envelope. For a schema pinned from another repository, check that repository out at a tag or commit and list the file here.
        type: string
        default: ''
      resolve-ids:
        description: The $id each resolve path must carry, one per line in the same order; a file with another $id is a finding, so a wrong pin fails loudly.
        type: string
        default: ''
      guards:
        description: 'guards mode. A JSON file: {"examples": <dir or [dirs]>, "counter-examples": <dir or [dirs]>, "mutants": [{"pointer": "/...", "mutation": "delete" | "true"} or {"pointer": "/...", "set": <value>}, ...]}, directories relative to the file.'
        type: string
        default: ''
permissions:
  contents: read
jobs:
  validate:
    name: schema-check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch jsonschema 17.2.1, pinned by sha256
        shell: bash
        env:
          TOOL_URL: https://github.com/sourcemeta/jsonschema/releases/download/v17.2.1/jsonschema-17.2.1-linux-x86_64.zip
          TOOL_SHA256: 9ffee3cfbe0fe1343d9d36bcce9e6036ec4d73e4b29f656c039fca6118da2f35
          TOOL_ARCHIVE: zip
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/tools/jsonschema"
          mkdir -p "$dir"
          curl -fsSL --retry 3 "$TOOL_URL" -o "$dir/archive"
          echo "$TOOL_SHA256  $dir/archive" | sha256sum -c -
          case "$TOOL_ARCHIVE" in
            tar.gz) tar -xzf "$dir/archive" -C "$dir" ;;
            zip) unzip -q "$dir/archive" -d "$dir" ;;
            *) echo "::error::unknown archive type $TOOL_ARCHIVE"; exit 1 ;;
          esac
      - name: Validate
        id: run
        shell: bash
        env:
          JSONSCHEMA: ${{ runner.temp }}/tools/jsonschema/jsonschema-17.2.1-linux-x86_64/bin/jsonschema
          SCHEMA: ${{ inputs.schema }}
          INSTANCES: ${{ inputs.instances }}
          FIXTURE: ${{ inputs._selftest-fixture }}
          FIXTURES_DIR: selftest/fixtures
          FINDING_RC: 2
          EXPECT: ${{ inputs.expect }}
          EACH: ${{ inputs.each }}
          MODE: ${{ inputs.mode }}
          RESOLVE: ${{ inputs.resolve }}
          RESOLVE_IDS: ${{ inputs.resolve-ids }}
          GUARDS: ${{ inputs.guards }}
          NODE_SPEC: '{"$schema":"https://json-schema.org/draft/2020-12/schema","$id":"https://github.com/practice-library/.github/spec/node/schema.json","title":"Fact node","description":"The envelope every fact node shares: id, type, name, source URL, measuredAt, attrs (verdict, fetched_at, quote, and an optional basis and status) and edges. A domain schema references this one and declares only its type values. That every edge target exists is checked by the graph checker, not by this schema.","type":"object","required":["id","type","name","source","measuredAt","attrs","edges"],"additionalProperties":false,"properties":{"id":{"type":"string","pattern":"^[a-z][a-z0-9-]*(\\.[a-z0-9][a-z0-9-]*)+$"},"type":{"type":"string","pattern":"^[a-z][a-z0-9-]*$","description":"One of the type values the domain schema declares."},"name":{"type":"string","minLength":1,"maxLength":120},"source":{"$ref":"#/$defs/url","description":"Where the fact was read: the official page for a documented fact, or the run or record that measured it for an observed one. The quote is on this page or in this record."},"measuredAt":{"type":"string","format":"date","pattern":"^(?:[0-9]{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12][0-9]|3[01])|(?:0[469]|11)-(?:0[1-9]|[12][0-9]|30)|02-(?:0[1-9]|1[0-9]|2[0-8]))|(?:[0-9]{2}(?:0[48]|[2468][048]|[13579][26])|(?:[02468][048]|[13579][26])00)-02-29)$","description":"The date the fact was last confirmed: a real calendar date, YYYY-MM-DD."},"attrs":{"type":"object","required":["verdict","fetched_at","quote"],"additionalProperties":false,"properties":{"verdict":{"enum":["allowed","denied","limited","unknown","absent"],"description":"allowed, denied or limited: what the page states. unknown: it could not be confirmed. absent: the page was checked and does not state it; note names the page checked and quote is its nearest sentence, and there is no value."},"fetched_at":{"type":"string","format":"date-time","pattern":"^(?:[0-9]{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12][0-9]|3[01])|(?:0[469]|11)-(?:0[1-9]|[12][0-9]|30)|02-(?:0[1-9]|1[0-9]|2[0-8]))|(?:[0-9]{2}(?:0[48]|[2468][048]|[13579][26])|(?:[02468][048]|[13579][26])00)-02-29)[Tt](?:[01][0-9]|2[0-3]):[0-5][0-9]:(?:[0-5][0-9]|60)(?:\\.[0-9]+)?Z$","description":"When the page was read, or for an observed fact when the measurement ran. UTC, a real calendar date and time (YYYY-MM-DDThh:mm:ssZ, optional fraction of a second; RFC 3339 allows a lower-case t)."},"quote":{"type":"string","minLength":1,"maxLength":500,"description":"A short sentence copied exactly from the page, or for an observed fact a line copied exactly from the run log or record."},"basis":{"enum":["documented","observed"],"description":"Where the number comes from: documented (the vendor states it) or observed (our own measurement). Absent means documented. A documented node and an observed node about the same quantity stay two nodes, linked by an observes edge from the observed one. A node with an observes edge must say basis observed.","default":"documented"},"value":{"type":"number","description":"A number only; its meaning is carried by unit, scope and window."},"unit":{"type":"string","minLength":1},"scope":{"type":"string","minLength":1},"window":{"type":"string","minLength":1},"note":{"type":"string","minLength":1,"maxLength":300,"description":"Prose that does not fit value, unit, scope or window."},"status":{"enum":["in-force","notified-not-in-force","draft","superseded"],"description":"Optional, for a fact that is a rule with a legal or published state: in-force (it applies now), notified-not-in-force (published, with a later start), draft (proposed, not adopted) or superseded (replaced by a later rule). Absent means the domain does not track it. A domain schema may narrow the list or forbid status, never add a value."}},"if":{"properties":{"verdict":{"const":"limited"}},"required":["verdict"]},"then":{"required":["scope"]}},"edges":{"type":"array","items":{"type":"object","required":["rel","to"],"additionalProperties":false,"properties":{"rel":{"enum":["availableOn","requires","grantedBy","limits","appliesTo","prohibitedBy","supersedes","hasRelease","introducedIn","removedIn","observes","issuedBy","partOf","madeUnder","imposes","amends","commencedBy"],"description":"The first eleven relate product facts. The last six relate legal texts: issuedBy: an instrument to the authority that issued it. partOf: a provision to its instrument. madeUnder: rules or directions to the enabling provision. imposes: a provision to the obligation, timeline, penalty or exemption it creates. amends: an instrument to the instrument it amends. commencedBy: a provision to the notification that brought it into force. A domain schema may restrict rel to the values it uses."},"to":{"type":"string","pattern":"^[a-z][a-z0-9-]*(\\.[a-z0-9][a-z0-9-]*)+$"}}}}},"$defs":{"url":{"type":"string","format":"uri","pattern":"^https://"}},"allOf":[{"if":{"required":["edges"],"properties":{"edges":{"contains":{"required":["rel"],"properties":{"rel":{"const":"observes"}}}}}},"then":{"properties":{"attrs":{"required":["basis"],"properties":{"basis":{"const":"observed"}}}}}},{"if":{"required":["attrs"],"properties":{"attrs":{"required":["verdict"],"properties":{"verdict":{"const":"absent"}}}}},"then":{"properties":{"attrs":{"required":["note"],"not":{"required":["value"]}}}}}]}'
        run: |
          set -uo pipefail
          # The default bash shell runs with -e; capture the exit code instead of letting it end the step.
          # main: combines per-file exit codes into one. RCS is a space-separated list, FINDING the validator's
          # finding exit code. Prints "pass 0" when every file passed, "finding <FINDING>" when every file was
          # rejected with a finding, and "mixed 1" otherwise (mixed results, another error, or no files), so an
          # expectation of pass or fail holds only when it holds for each file. The last word is the exit code.
          main() {
            local rc all_pass=true all_finding=true n=0
            for rc in $RCS; do
              n=$((n + 1))
              [ "$rc" = 0 ] || all_pass=false
              [ "$rc" = "$FINDING" ] || all_finding=false
            done
            if [ "$n" -eq 0 ]; then echo "mixed 1"; return 0; fi
            if [ "$all_pass" = true ]; then echo "pass 0"; elif [ "$all_finding" = true ]; then echo "finding $FINDING"; else echo "mixed 1"; fi
          }
          base="$GITHUB_WORKSPACE"
          if [ -n "$FIXTURE" ]; then base="$GITHUB_WORKSPACE/$FIXTURES_DIR/$FIXTURE"; fi
          # A setup error (any other exit) ends the step red, except in a self-test fixture that expects it.
          finish() { echo "rc=$1" >> "$GITHUB_OUTPUT"; [ "$1" -eq 0 ] || [ "$1" -eq "$FINDING_RC" ] || { [ -n "$FIXTURE" ] && [ "$EXPECT" = error ]; }; exit; }
          lines() { printf '%s\n' "$1" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e '/^$/d'; }
          # The shared fact-node envelope (https://github.com/practice-library/.github/spec/node/schema.json) is always resolvable, so a domain
          # schema can reference it without keeping a copy.
          printf '%s' "$NODE_SPEC" > "$RUNNER_TEMP/node-spec.json"
          resolve=(--resolve "$RUNNER_TEMP/node-spec.json")
          mapfile -t paths < <(lines "$RESOLVE")
          mapfile -t ids < <(lines "$RESOLVE_IDS")
          if [ "${#ids[@]}" -gt 0 ] && [ "${#ids[@]}" -ne "${#paths[@]}" ]; then
            echo "::error::resolve-ids lists ${#ids[@]} ids for ${#paths[@]} resolve paths"; finish 1
          fi
          for k in "${!paths[@]}"; do
            p="$base/${paths[$k]}"
            [ -f "$p" ] || { echo "::error::resolve: no file ${paths[$k]}"; finish 1; }
            if [ "${#ids[@]}" -gt 0 ]; then
              got="$(jq -r '.["$id"] // ""' "$p" 2>/dev/null)" || { echo "::error file=${paths[$k]}::not JSON"; finish 1; }
              if [ "$got" != "${ids[$k]}" ]; then
                echo "::error file=${paths[$k]}::its \$id is '$got', expected '${ids[$k]}' (a wrong pin?)"; finish 1
              fi
            fi
            resolve+=(--resolve "$p")
          done
          case "${MODE:-validate}" in
            validate)
              [ -n "$INSTANCES" ] || { echo "::error::validate mode needs instances"; finish 1; }
              if [ "$EACH" = true ]; then
                RCS=""
                while IFS= read -r -d '' file; do
                  one=0
                  "$JSONSCHEMA" validate "${resolve[@]}" "$base/$SCHEMA" "$file" > /dev/null 2>&1 || one=$?
                  echo "exit $one: ${file#"$base"/}"
                  RCS="$RCS $one"
                done < <(find "$base/$INSTANCES" -type f -name '*.json' -print0 | sort -z)
                FINDING="$FINDING_RC"
                result="$(main)"
                echo "$result"
                finish "${result##* }"
              fi
              rc=0
              "$JSONSCHEMA" validate "${resolve[@]}" "$base/$SCHEMA" "$base/$INSTANCES" || rc=$?
              finish "$rc" ;;
            metaschema)
              rc=0
              "$JSONSCHEMA" metaschema "$base/$SCHEMA" || rc=$?
              finish "$rc" ;;
            guards)
              [ -n "$GUARDS" ] || { echo "::error::guards mode needs guards"; finish 1; }
              gfile="$base/$GUARDS"; gdir="$(dirname "$gfile")"
              dirs='def dirs: if type == "string" then [.] elif type == "array" and length > 0 and all(.[]; type == "string") then . else error("") end;'
              jq -e "$dirs"' (.examples | dirs) and (.["counter-examples"] | dirs) and (.mutants | type) == "array" and (.mutants | length) > 0' "$gfile" > /dev/null 2>&1 \
                || { echo "::error file=$GUARDS::guards must be {\"examples\": dir or [dirs], \"counter-examples\": dir or [dirs], \"mutants\": [at least one]}"; finish 1; }
              for key in examples counter-examples; do
                while IFS= read -r d; do
                  [ -d "$gdir/$d" ] || { echo "::error file=$GUARDS::$key: no directory $d"; finish 1; }
                done < <(jq -r "$dirs"' .["'"$key"'"] | dirs[]' "$gfile")
              done
              collect() { local d; while IFS= read -r d; do find "$gdir/$d" -type f -name '*.json' -print0; done < <(jq -r "$dirs"' .["'"$1"'"] | dirs[]' "$gfile") | sort -z; }
              mapfile -d '' examples < <(collect examples)
              mapfile -d '' counters < <(collect counter-examples)
              [ "${#examples[@]}" -gt 0 ] && [ "${#counters[@]}" -gt 0 ] || { echo "::error::guards needs at least one example and one counter-example"; finish 1; }
              # judge <schema>: prints "red <file>" for the first example that fails or counter-example that
              # passes, "green" when none does, or "error <file>" when the validator cannot run.
              judge() {
                local f one
                for f in "${examples[@]}"; do one=0; "$JSONSCHEMA" validate "${resolve[@]}" "$1" "$f" > /dev/null 2>&1 || one=$?
                  case "$one" in 0) ;; "$FINDING_RC") echo "red ${f#"$gdir"/}"; return ;; *) echo "error ${f#"$gdir"/}"; return ;; esac; done
                for f in "${counters[@]}"; do one=0; "$JSONSCHEMA" validate "${resolve[@]}" "$1" "$f" > /dev/null 2>&1 || one=$?
                  case "$one" in 0) echo "red ${f#"$gdir"/}"; return ;; "$FINDING_RC") ;; *) echo "error ${f#"$gdir"/}"; return ;; esac; done
                echo green
              }
              baseline="$(judge "$base/$SCHEMA")"
              [ "$baseline" = green ] || { echo "::error::the unmutated schema already gives $baseline; fix the fixtures first"; finish 1; }
              unset -f main
              # main: prints the schema in SCHEMA with one mutant applied, as one line of JSON, or "invalid ..." when
              # the mutant cannot be applied. A mutant names a place by JSON Pointer (RFC 6901: "/a/b", "~1" for "/"
              # and "~0" for "~"); the place must exist, so a mutant that names nothing is an error, never a pass.
              #   SCHEMA  a JSON file
              #   MUTANT  {"pointer": "/...", "mutation": "delete"} removes the place,
              #           {"pointer": "/...", "mutation": "true"} replaces it with true (a subschema that accepts all),
              #           {"pointer": "/...", "set": <value>} replaces it with the value
              main() {
                local out
                if ! out="$(jq -c --argjson m "${MUTANT:-null}" '
                    def tokens:
                      if (type == "string") and startswith("/") then
                        .[1:] | split("/")
                        | map(if test("~([^01]|$)") then error("~ must be written ~0 or ~1") else gsub("~1"; "/") | gsub("~0"; "~") end)
                      else error("pointer must start with /") end;
                    . as $doc
                    | ($m | if type == "object" and (.pointer | type) == "string" then . else error("mutant must be an object with a pointer") end)
                    | ($m.pointer | tokens) as $t
                    | (reduce $t[] as $k ({path: [], ok: true};
                        if .ok | not then . else
                          .path as $p | ($doc | getpath($p)) as $here
                          | if ($here | type) == "object" and ($here | has($k)) then .path += [$k]
                            elif ($here | type) == "array" and ($k | test("^(0|[1-9][0-9]*)$")) and (($k | tonumber) < ($here | length)) then .path += [$k | tonumber]
                            else .ok = false end end)) as $r
                    | if ($r.ok | not) then error("no such place: " + $m.pointer)
                      elif ($m | has("set")) and ($m | has("mutation")) then error("a mutant has either mutation or set")
                      elif ($m | has("set")) then $doc | setpath($r.path; $m.set)
                      elif $m.mutation == "delete" then $doc | delpaths([$r.path])
                      elif $m.mutation == "true" then $doc | setpath($r.path; true)
                      else error("mutation must be delete or true, or use set") end' "$SCHEMA" 2>&1)"; then
                  echo "invalid ${out#jq: error (at *): }"; return 0
                fi
                printf '%s\n' "$out"
              }
              survived=0
              SCHEMA="$base/$SCHEMA"; export SCHEMA
              while IFS= read -r MUTANT; do
                export MUTANT
                mutated="$(main)"
                case "$mutated" in invalid*) echo "::error::$MUTANT: ${mutated#invalid }"; finish 1 ;; esac
                printf '%s\n' "$mutated" > "$RUNNER_TEMP/mutant.json"
                verdict="$(judge "$RUNNER_TEMP/mutant.json")"
                case "$verdict" in
                  red*) echo "caught $MUTANT by ${verdict#red }" ;;
                  green) echo "::error::survived $MUTANT: no example or counter-example turned red"; survived=$((survived + 1)) ;;
                  *) echo "::error::$MUTANT: the validator could not run on ${verdict#error }"; finish 1 ;;
                esac
              done < <(jq -c '.mutants[]' "$gfile")
              if [ "$survived" -gt 0 ]; then finish "$FINDING_RC"; fi
              finish 0 ;;
            *) echo "::error::mode must be validate, metaschema or guards, got $MODE"; finish 1 ;;
          esac
      - name: Compare the result with the expectation
        shell: bash
        env:
          EXPECT: ${{ inputs.expect }}
          RC: ${{ steps.run.outputs.rc }}
          FINDING_RC: 2
        run: |
          set -euo pipefail
          case "${EXPECT:-pass}" in
            pass) [ "$RC" = 0 ] || { echo "::error::jsonschema reported findings (exit $RC)"; exit 1; } ;;
            fail) [ "$RC" = "$FINDING_RC" ] || { echo "::error::expected jsonschema to report a finding (exit $FINDING_RC), got exit $RC"; exit 1; } ;;
            error) [ "$RC" != 0 ] && [ "$RC" != "$FINDING_RC" ] || { echo "::error::expected jsonschema to stop on a setup error, got exit $RC"; exit 1; } ;;
            *) echo "::error::expect must be pass, fail or (in a self-test fixture) error, got $EXPECT"; exit 1 ;;
          esac
