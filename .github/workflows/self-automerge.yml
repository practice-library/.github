# Generated from templates/.github/workflows/self-automerge.yml and policy/constants.json by scripts/render.sh. Do not edit.
name: self-automerge
# pull_request_target runs this file as it is on main, never the pull request's copy.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
    branches: [main]
permissions:
  contents: write
  pull-requests: write
jobs:
  automerge:
    uses: ./.github/workflows/automerge.yml
    with:
      allow-paths: '["ghgraph/graph/nodes/","ghgraph/INDEX.md"]'
      trusted-authors: '["practice-library[bot]"]'
