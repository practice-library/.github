# Generated from templates/.github/workflows/gate.yml and policy/constants.json by scripts/render.sh. Do not edit.
name: gate
on:
  workflow_call:
    inputs:
      needs:
        description: The caller's toJSON(needs). The gate passes only when every one of those jobs succeeded and they are exactly the jobs listed in .github/required-checks.json.
        type: string
        required: true
permissions:
  contents: read
jobs:
  gate:
    name: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github
            docs
      - name: The needs are exactly the jobs in .github/required-checks.json
        shell: bash
        env:
          NEEDS: ${{ inputs.needs }}
          FILE: .github/required-checks.json
          MANDATORY: '["leak-scan","denylist","removed-paths","release-note","schema-loosening"]'
        run: |
          set -euo pipefail
          # main: prints "ok ..." when the job ids in REQUIRED (the jobs array of the repository's required-checks
          # file) are exactly the keys of NEEDS (the caller's toJSON(needs)) and include every id in MANDATORY;
          # otherwise "missing ...", "unlisted ..." or "invalid ...". The caller fails unless the first word is ok.
          main() {
            local missing unlisted absent
            if ! jq -en --argjson r "$REQUIRED" '($r | type) == "array" and ($r | length) > 0 and all($r[]; type == "string")' > /dev/null 2>&1; then
              echo "invalid the required-checks file must list job ids in a non-empty jobs array"; return 0
            fi
            if ! jq -en --argjson n "$NEEDS" '($n | type) == "object"' > /dev/null 2>&1; then
              echo "invalid needs must be the caller's toJSON(needs)"; return 0
            fi
            missing="$(jq -cn --argjson n "$NEEDS" --argjson r "$REQUIRED" '$r - ($n | keys)')"
            unlisted="$(jq -cn --argjson n "$NEEDS" --argjson r "$REQUIRED" '($n | keys) - $r')"
            absent="$(jq -cn --argjson r "$REQUIRED" --argjson m "$MANDATORY" '$m - $r')"
            if [ "$absent" != "[]" ]; then echo "missing jobs every repository must run: $absent"; return 0; fi
            if [ "$missing" != "[]" ]; then echo "missing listed in the required-checks file but not in needs: $missing"; return 0; fi
            if [ "$unlisted" != "[]" ]; then echo "unlisted in needs but not in the required-checks file: $unlisted"; return 0; fi
            echo "ok the needs are exactly the required-checks file"
          }
          [ -f "$FILE" ] || { echo "::error::$FILE is missing"; exit 1; }
          REQUIRED="$(jq -c '.jobs' "$FILE")"
          export REQUIRED
          result="$(main)"
          echo "$result"
          [ "${result%% *}" = ok ]
      - name: CODEOWNERS owns no path in .github/automerge-paths.json
        shell: bash
        env:
          PATHS_FILE: .github/automerge-paths.json
        run: |
          set -euo pipefail
          # main: prints "ok ..." when no auto-merge allowlist path (ALLOW, a JSON array; an entry ending in /
          # covers everything under it) is owned in the CODEOWNERS text (CODEOWNERS); otherwise "owned [...]",
          # or "unsupported <pattern>" for a pattern this check cannot judge (only *, /path and /path/ are
          # understood). The last matching line wins, as in GitHub.
          main() {
            jq -nr --arg text "$CODEOWNERS" --argjson allow "$ALLOW" '
              def norm: ltrimstr("/");
              [ $text | split("\n")[] | sub("#.*$"; "") | gsub("^\\s+|\\s+$"; "") | select(length > 0)
                | [splits("\\s+")] | {pattern: .[0], owners: .[1:]} ] as $lines
              | ([ $lines[] | select((.pattern == "*" or (.pattern | test("^/[^*?\\[\\]!]+$"))) | not) | .pattern ] | first) as $bad
              | if $bad != null then "unsupported \($bad)"
                else
                  [ $allow[] as $a
                    | ([ $lines | to_entries[]
                         | .value.pattern as $p | ($p | norm) as $q
                         | select($p == "*" or $a == $q or ($a | startswith(($q | rtrimstr("/")) + "/"))
                                  or (($a | endswith("/")) and ($q | startswith($a)))) ]
                       | last) as $hit
                    | select($hit != null and ($hit.value.owners | length) > 0)
                    | $a ]
                  | if length == 0 then "ok no allowlisted path has an owner" else "owned \(tojson)" end
                end'
          }
          ALLOW='[]'
          if [ -f "$PATHS_FILE" ]; then ALLOW="$(jq -c '.paths' "$PATHS_FILE")"; fi
          CODEOWNERS=""
          for f in .github/CODEOWNERS CODEOWNERS docs/CODEOWNERS; do
            if [ -f "$f" ]; then CODEOWNERS="$(cat "$f")"; break; fi
          done
          export ALLOW CODEOWNERS
          result="$(main)"
          echo "$result"
          [ "${result%% *}" = ok ]
      - name: Fetch yq 4.44.3, pinned by sha256
        shell: bash
        env:
          TOOL_URL: https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64.tar.gz
          TOOL_SHA256: a347ccde5e32c607670e15526e295c58a555a68cbb36d15cf18d24fd7af0e2fd
          TOOL_ARCHIVE: tar.gz
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/tools/yq"
          mkdir -p "$dir"
          curl -fsSL --retry 3 "$TOOL_URL" -o "$dir/archive"
          echo "$TOOL_SHA256  $dir/archive" | sha256sum -c -
          case "$TOOL_ARCHIVE" in
            tar.gz) tar -xzf "$dir/archive" -C "$dir" ;;
            zip) unzip -q "$dir/archive" -d "$dir" ;;
            *) echo "::error::unknown archive type $TOOL_ARCHIVE"; exit 1 ;;
          esac
      - name: Every practice-library workflow or action is pinned to a commit, not a branch
        shell: bash
        env:
          ROOT: .
          ORG: practice-library
          YQ: ${{ runner.temp }}/tools/yq/yq_linux_amd64
        run: |
          set -euo pipefail
          # main: prints "ok ..." when every uses: in ROOT/.github/workflows/*.yml or *.yaml that names a workflow
          # or action of ORG is pinned to a full commit (40 lower-case hex characters), otherwise
          # "unpinned [<file>:<line> <ref>, ...]". A branch or a tag can move, so either is refused; a uses: of
          # another owner, a local ./ path or a docker:// image is not judged. The owner is compared without case.
          # Each file is parsed as YAML (yq, which follows anchors, aliases and merge keys), so a uses: written as
          # a quoted key, a flow mapping, a block scalar or an alias is judged like any other. The uses: GitHub reads
          # are judged: jobs.<id>.uses and jobs.<id>.steps[].uses. A file that does not parse prints "invalid".
          #   ROOT  the checked-out repository     ORG  the organisation whose references must be pinned
          #   YQ    the yq (mikefarah, v4) binary, default yq
          main() {
            local dir="${ROOT:-.}/.github/workflows" yq="${YQ:-yq}" files=() f found="" uses one
            [ -n "${ORG:-}" ] || { echo "invalid ORG is empty"; return 0; }
            [ -d "$dir" ] || { echo "ok no workflows"; return 0; }
            for f in "$dir"/*.yml "$dir"/*.yaml; do [ -f "$f" ] && files+=("$f"); done
            [ "${#files[@]}" -gt 0 ] || { echo "ok no workflows"; return 0; }
            command -v "$yq" > /dev/null 2>&1 || { echo "invalid no yq to read the workflows"; return 0; }
            for f in "${files[@]}"; do
              uses="$("$yq" -o=json '[.jobs // {} | to_entries[]
                  | ((.value.uses | select(. != null)), (.value.steps // [] | .[] | .uses | select(. != null)))
                  | {"line": line, "v": .}]' "$f" 2>/dev/null)" \
                || { echo "invalid ${f#"${ROOT:-.}/"} is not YAML"; return 0; }
              one="$(jq -sr --arg org "$(printf '%s' "$ORG" | tr '[:upper:]' '[:lower:]')" --arg f "${f#"${ROOT:-.}/"}" '
                  (add // []) | .[]
                  | (.v | tostring | gsub("^\\s+|\\s+$"; "")) as $v
                  | ($v | split("/")[0] | ascii_downcase) as $owner
                  | select($owner == $org and ($v | contains("/")))
                  | (if ($v | contains("@")) then ($v | sub("^.*@"; "")) else "(none)" end) as $ref
                  | select($ref | test("^[0-9a-f]{40}$") | not)
                  | "\($f):\(.line) \($ref)"' <<<"$uses")" || { echo "invalid ${f#"${ROOT:-.}/"} could not be judged"; return 0; }
              [ -n "$one" ] && found="$found$one"$'\n'
            done
            if [ -z "$found" ]; then echo "ok every $ORG reference is pinned to a commit"; return 0; fi
            echo "unpinned $(printf '%s' "$found" | jq -Rsc 'split("\n") | map(select(length > 0))')"
          }
          export ROOT ORG
          result="$(main)"
          echo "$result"
          [ "${result%% *}" = ok ] || { echo "::error::$result: pin the full commit SHA of a release, with the tag as a comment (ADOPTING.md)"; exit 1; }
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ inputs.needs }}
