# Generated from templates/.github/workflows/gate.yml and policy/constants.json by scripts/render.sh. Do not edit.
name: gate
on:
  workflow_call:
    inputs:
      needs:
        description: The caller's toJSON(needs). The gate passes only when every one of those jobs succeeded and they are exactly the jobs listed in .github/required-checks.json.
        type: string
        required: true
permissions:
  contents: read
jobs:
  gate:
    name: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Checks out this repository's tooling at the commit that defines the running job, beside the caller's
      # checkout, and makes PRACTICE_CI (the launcher) and CALLER_ROOT available to the later steps.
      # job.workflow_repository and job.workflow_sha exist on GitHub.com only; both are judged before checkout,
      # since an empty repository or ref would make checkout pick the caller or its default branch.
      - name: The workflow's own repository and commit
        shell: bash
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          # main: judges the identity of the workflow that defines the running job, before anything is checked
          # out with it. Prints "ok <repository>@<sha>" when both are usable, otherwise "invalid <why>". Nothing
          # is defaulted: actions/checkout reads an empty repository as the caller and an empty ref as the default
          # branch, so an empty or malformed identity must stop the job here instead of selecting other code.
          #   WORKFLOW_REPOSITORY  job.workflow_repository: owner/name
          #   WORKFLOW_SHA         job.workflow_sha: the full commit, 40 lower-case hex characters
          main() {
            local repo="${WORKFLOW_REPOSITORY:-}" sha="${WORKFLOW_SHA:-}"
            if [ -z "$repo" ]; then echo "invalid job.workflow_repository is empty (this needs GitHub.com)"; return 0; fi
            if ! [[ "$repo" =~ ^[A-Za-z0-9-]+/[A-Za-z0-9._-]+$ ]] || [[ "$repo" == */. ]] || [[ "$repo" == */.. ]]; then
              echo "invalid job.workflow_repository is not owner/name"; return 0
            fi
            if [ -z "$sha" ]; then echo "invalid job.workflow_sha is empty (this needs GitHub.com)"; return 0; fi
            if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then echo "invalid job.workflow_sha is not 40 lower-case hex characters"; return 0; fi
            echo "ok $repo@$sha"
          }
          verdict="$(main)"
          echo "$verdict"
          [ "$verdict" = "ok $WORKFLOW_REPOSITORY@$WORKFLOW_SHA" ] || { echo "::error::${verdict#* }; nothing is checked out"; exit 1; }
      - name: Check out the tooling at the workflow's own commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: practice-ci
          persist-credentials: false
          submodules: false
          lfs: false
      - name: The tooling is exactly that commit
        shell: bash
        env:
          TOOLING: ${{ github.workspace }}/practice-ci
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          LAUNCHER: tooling/practice-ci
        run: |
          set -euo pipefail
          # main: judges the tooling checkout before anything in it runs. Prints "ok <sha>" when the repository in
          # TOOLING is at exactly WORKFLOW_SHA and holds the launcher; "mismatch ..." when HEAD is another commit;
          # "bootstrap ..." when that commit has no launcher (a commit from before the tooling existed: pin a
          # release that ships it, nothing is fetched from elsewhere); "invalid ..." when TOOLING is no repository.
          #   TOOLING       the directory the workflow's own commit was checked out into
          #   WORKFLOW_SHA  job.workflow_sha
          #   LAUNCHER      the launcher's path inside TOOLING
          main() {
            local head
            if ! head="$(git -C "${TOOLING:-}" rev-parse --verify --quiet HEAD^{commit} 2>/dev/null)"; then
              echo "invalid ${TOOLING:-(unset)} is not a checked-out repository"; return 0
            fi
            if [ "$head" != "${WORKFLOW_SHA:-}" ]; then
              echo "mismatch the tooling checkout is at $head, not job.workflow_sha ${WORKFLOW_SHA:-(unset)}"; return 0
            fi
            if [ -z "${LAUNCHER:-}" ] || [ ! -f "$TOOLING/$LAUNCHER" ]; then
              echo "bootstrap $head has no ${LAUNCHER:-launcher}: this commit predates the tooling, so pin a release that ships it"; return 0
            fi
            echo "ok $head"
          }
          verdict="$(main)"
          echo "$verdict"
          [ "$verdict" = "ok $WORKFLOW_SHA" ] || { echo "::error::${verdict#* }"; exit 1; }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.12.16
      - name: The tooling's interpreter
        shell: bash
        env:
          TOOLING: ${{ github.workspace }}/practice-ci
          CALLER: ${{ github.workspace }}/caller
          LAUNCHER: tooling/practice-ci
        run: |
          set -euo pipefail
          "$TOOLING/$LAUNCHER" version
          { echo "PRACTICE_CI=$TOOLING/$LAUNCHER"; echo "CALLER_ROOT=$CALLER"; } >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: caller
          persist-credentials: false
          sparse-checkout: |
            .github
            docs
      - name: The needs are exactly the jobs in .github/required-checks.json
        shell: bash
        working-directory: caller
        env:
          NEEDS: ${{ inputs.needs }}
          FILE: .github/required-checks.json
          MANDATORY: '["leak-scan","denylist","removed-paths","release-note","schema-loosening"]'
        run: |
          set -euo pipefail
          [ -f "$FILE" ] || { echo "::error::$FILE is missing"; exit 1; }
          REQUIRED="$(jq -c '.jobs' "$FILE")"
          export REQUIRED NEEDS MANDATORY
          "$PRACTICE_CI" fragment gate-required --root "$CALLER_ROOT"
      - name: CODEOWNERS owns no path in .github/automerge-paths.json
        shell: bash
        working-directory: caller
        env:
          PATHS_FILE: .github/automerge-paths.json
        run: |
          set -euo pipefail
          ALLOW='[]'
          if [ -f "$PATHS_FILE" ]; then ALLOW="$(jq -c '.paths' "$PATHS_FILE")"; fi
          CODEOWNERS=""
          for f in .github/CODEOWNERS CODEOWNERS docs/CODEOWNERS; do
            if [ -f "$f" ]; then CODEOWNERS="$(cat "$f")"; break; fi
          done
          export ALLOW CODEOWNERS
          "$PRACTICE_CI" fragment codeowners-allow --root "$CALLER_ROOT"
      - name: Fetch yq 4.44.3, pinned by sha256
        shell: bash
        env:
          TOOL_URL: https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64.tar.gz
          TOOL_SHA256: a347ccde5e32c607670e15526e295c58a555a68cbb36d15cf18d24fd7af0e2fd
          TOOL_ARCHIVE: tar.gz
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/tools/yq"
          mkdir -p "$dir"
          curl -fsSL --retry 3 "$TOOL_URL" -o "$dir/archive"
          echo "$TOOL_SHA256  $dir/archive" | sha256sum -c -
          case "$TOOL_ARCHIVE" in
            tar.gz) tar -xzf "$dir/archive" -C "$dir" ;;
            zip) unzip -q "$dir/archive" -d "$dir" ;;
            *) echo "::error::unknown archive type $TOOL_ARCHIVE"; exit 1 ;;
          esac
      - name: Every practice-library workflow or action is pinned to a commit, not a branch
        shell: bash
        working-directory: caller
        env:
          ORG: practice-library
          YQ: ${{ runner.temp }}/tools/yq/yq_linux_amd64
        run: |
          set -euo pipefail
          ROOT="$CALLER_ROOT"
          export ROOT ORG
          "$PRACTICE_CI" fragment pin-check --root "$CALLER_ROOT" \
            || { echo "::error::pin the full commit SHA of a release, with the tag as a comment (ADOPTING.md)"; exit 1; }
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ inputs.needs }}
