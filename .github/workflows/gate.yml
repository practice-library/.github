# Generated from templates/.github/workflows/gate.yml and policy/constants.json by scripts/render.sh. Do not edit.
name: gate
on:
  workflow_call:
    inputs:
      needs:
        description: The caller's toJSON(needs). The gate passes only when every one of those jobs succeeded and they are exactly the jobs listed in .github/required-checks.json.
        type: string
        required: true
permissions:
  contents: read
jobs:
  gate:
    name: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github
            docs
      - name: The needs are exactly the jobs in .github/required-checks.json
        shell: bash
        env:
          NEEDS: ${{ inputs.needs }}
          FILE: .github/required-checks.json
          MANDATORY: '["leak-scan"]'
        run: |
          set -euo pipefail
          # main: prints "ok ..." when the job ids in REQUIRED (the jobs array of the repository's required-checks
          # file) are exactly the keys of NEEDS (the caller's toJSON(needs)) and include every id in MANDATORY;
          # otherwise "missing ...", "unlisted ..." or "invalid ...". The caller fails unless the first word is ok.
          main() {
            local missing unlisted absent
            if ! jq -en --argjson r "$REQUIRED" '($r | type) == "array" and ($r | length) > 0 and all($r[]; type == "string")' > /dev/null 2>&1; then
              echo "invalid the required-checks file must list job ids in a non-empty jobs array"; return 0
            fi
            if ! jq -en --argjson n "$NEEDS" '($n | type) == "object"' > /dev/null 2>&1; then
              echo "invalid needs must be the caller's toJSON(needs)"; return 0
            fi
            missing="$(jq -cn --argjson n "$NEEDS" --argjson r "$REQUIRED" '$r - ($n | keys)')"
            unlisted="$(jq -cn --argjson n "$NEEDS" --argjson r "$REQUIRED" '($n | keys) - $r')"
            absent="$(jq -cn --argjson r "$REQUIRED" --argjson m "$MANDATORY" '$m - $r')"
            if [ "$absent" != "[]" ]; then echo "missing jobs every repository must run: $absent"; return 0; fi
            if [ "$missing" != "[]" ]; then echo "missing listed in the required-checks file but not in needs: $missing"; return 0; fi
            if [ "$unlisted" != "[]" ]; then echo "unlisted in needs but not in the required-checks file: $unlisted"; return 0; fi
            echo "ok the needs are exactly the required-checks file"
          }
          [ -f "$FILE" ] || { echo "::error::$FILE is missing"; exit 1; }
          REQUIRED="$(jq -c '.jobs' "$FILE")"
          export REQUIRED
          result="$(main)"
          echo "$result"
          [ "${result%% *}" = ok ]
      - name: CODEOWNERS owns no path in .github/automerge-paths.json
        shell: bash
        env:
          PATHS_FILE: .github/automerge-paths.json
        run: |
          set -euo pipefail
          # main: prints "ok ..." when no auto-merge allowlist path (ALLOW, a JSON array; an entry ending in /
          # covers everything under it) is owned in the CODEOWNERS text (CODEOWNERS); otherwise "owned [...]",
          # or "unsupported <pattern>" for a pattern this check cannot judge (only *, /path and /path/ are
          # understood). The last matching line wins, as in GitHub.
          main() {
            jq -nr --arg text "$CODEOWNERS" --argjson allow "$ALLOW" '
              def norm: ltrimstr("/");
              [ $text | split("\n")[] | sub("#.*$"; "") | gsub("^\\s+|\\s+$"; "") | select(length > 0)
                | [splits("\\s+")] | {pattern: .[0], owners: .[1:]} ] as $lines
              | ([ $lines[] | select((.pattern == "*" or (.pattern | test("^/[^*?\\[\\]!]+$"))) | not) | .pattern ] | first) as $bad
              | if $bad != null then "unsupported \($bad)"
                else
                  [ $allow[] as $a
                    | ([ $lines | to_entries[]
                         | .value.pattern as $p | ($p | norm) as $q
                         | select($p == "*" or $a == $q or ($a | startswith(($q | rtrimstr("/")) + "/"))
                                  or (($a | endswith("/")) and ($q | startswith($a)))) ]
                       | last) as $hit
                    | select($hit != null and ($hit.value.owners | length) > 0)
                    | $a ]
                  | if length == 0 then "ok no allowlisted path has an owner" else "owned \(tojson)" end
                end'
          }
          ALLOW='[]'
          if [ -f "$PATHS_FILE" ]; then ALLOW="$(jq -c '.paths' "$PATHS_FILE")"; fi
          CODEOWNERS=""
          for f in .github/CODEOWNERS CODEOWNERS docs/CODEOWNERS; do
            if [ -f "$f" ]; then CODEOWNERS="$(cat "$f")"; break; fi
          done
          export ALLOW CODEOWNERS
          result="$(main)"
          echo "$result"
          [ "${result%% *}" = ok ]
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ inputs.needs }}
