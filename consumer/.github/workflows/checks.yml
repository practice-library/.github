# Generated from templates/consumer/.github/workflows/checks.yml and policy/constants.json by scripts/render.sh. Do not edit.
name: checks
# Calls practice-library/.github's reusable workflows at one pinned commit. The gate's needs must
# equal the jobs in .github/required-checks.json.
on:
  pull_request:
    branches: [main]
    # labeled and unlabeled re-run schema-loosening when a maintainer adds or removes its label.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  discover:
    uses: practice-library/.github/.github/workflows/discover.yml@__PIN__ # __REF__
    with:
      check: schema-check
  schema-check:
    needs: [discover]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.targets) }}
    uses: practice-library/.github/.github/workflows/schema-check.yml@__PIN__ # __REF__
    # Every key a check.json row may carry, generated from the checks row so none is dropped.
    with:
      schema: ${{ matrix.schema }}
      instances: ${{ matrix.instances }}
      resolve: ${{ matrix.resolve }}
      guards: ${{ matrix.guards }}
      expect: ${{ matrix.expect }}
      each: ${{ matrix.each }}
      mode: ${{ matrix.mode }}
      resolve-ids: ${{ matrix.resolve-ids }}
  leak-scan:
    uses: practice-library/.github/.github/workflows/leak-scan.yml@__PIN__ # __REF__
  denylist:
    permissions:
      contents: read
      pull-requests: read
    uses: practice-library/.github/.github/workflows/guard.yml@__PIN__ # __REF__
    with:
      guard: denylist
  removed-paths:
    permissions:
      contents: read
      pull-requests: read
    uses: practice-library/.github/.github/workflows/guard.yml@__PIN__ # __REF__
    with:
      guard: removed-paths
  release-note:
    permissions:
      contents: read
      pull-requests: read
    uses: practice-library/.github/.github/workflows/guard.yml@__PIN__ # __REF__
    with:
      guard: release-note
  schema-loosening:
    permissions:
      contents: read
      pull-requests: read
    uses: practice-library/.github/.github/workflows/guard.yml@__PIN__ # __REF__
    with:
      guard: schema-loosening
  gate:
    if: always()
    needs: [discover, schema-check, leak-scan, denylist, removed-paths, release-note, schema-loosening]
    uses: practice-library/.github/.github/workflows/gate.yml@__PIN__ # __REF__
    with:
      needs: ${{ toJSON(needs) }}
