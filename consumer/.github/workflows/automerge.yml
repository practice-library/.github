name: automerge
# pull_request_target runs this file as it is on the default branch, never the pull request's copy.
# The allowlist is .github/automerge-paths.json on the base commit.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
    branches: [main]
permissions:
  contents: write
  pull-requests: write
jobs:
  automerge:
    uses: practice-library/.github/.github/workflows/automerge.yml@__PIN__ # __REF__
    with:
      trusted-authors: '["practice-library[bot]"]'
